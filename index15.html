else if(t==='flash'||t==='new'){flt={k:t,s:[],l:it.l};$('#q').value='';show('shop');draw()}
else if(t==='view'){if(!it.r||it.r==='shop'){clearF();show('shop')}else if(V.includes(it.r))show(it.r)}
else if(t==='page')helpOpen(it.r)

/* ---------- product photo upload (Supabase "products" bucket) ---------- */
async function shrink(f){try{if(!/^image\//.test(f.type))return f;const bm=await createImageBitmap(f),s=Math.min(1,1000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(x){return f}}
async function upImg(f){if(!f)return'';if(!sb)throw new Error('Supabase is not connected');f=await shrink(f);const p=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_'),r=await sb.storage.from('products').upload(p,f,{contentType:f.type||'image/jpeg'});if(r.error)throw r.error;return sb.storage.from('products').getPublicUrl(p).data.publicUrl}
async function addP(){const u=me(),e=m=>$('#er').textContent=m;if(!canProd(u))return e('You are not allowed to list products.');
const n=$('#pn').value.trim(),p=+$('#pp').value,c=$('#pc').value.trim(),f=$('#pf').files[0];
if(!n||!(p>0)||!c)return e('Fill in name, price and category.');
let img=($('#pimgu').value||'').trim();if(img&&!/^https:\/\//.test(img))return e('Photo link must start with https://');
if(f){e('Uploading photo...');try{img=await upImg(f)}catch(x){return e('Photo upload failed: '+(x.message||x)+'. Run the Supabase SQL once, or paste a photo link instead.')}}
products.push({id:'p'+Date.now(),e:$('#pe').value||'🛒',n,p,c,u:$('#pu').value.trim(),d:$('#pdsc').value.trim(),dt:(($('#pdt')||{}).value||'').trim(),img,shop:$('#psh').value.trim()||'jhafex.com',fl:$('#pfl').checked,t:Date.now(),by:u.id});
set('products',products);draw();toast('Product listed');dash()}
async function chgImg(id,inp){const f=inp.files[0];if(!f)return;toast('Uploading photo...');try{const url=await upImg(f);products=products.map(p=>p.id===id?{...p,img:url}:p);set('products',products);draw();toast('Photo saved');dash()}catch(x){toast('Upload failed: '+(x.message||x))}}
function togFl(id){products=products.map(p=>p.id===id?{...p,fl:!p.fl}:p);set('products',products);draw();dash()}
function editP(id){const p=products.find(x=>x.id===id);if(!p)return;openM(`<h3>Edit product</h3><label>Name</label><input id="en" value="${esc(p.n)}"><label>Unit</label><input id="eu" value="${esc(p.u||'')}"><label>Price (৳)</label><input id="ep" type="number" min="1" value="${p.p}"><label>Category</label><input id="ec" list="cl" value="${esc(p.c)}"><label>Shop / vendor</label><input id="es" list="sl" value="${esc(p.shop||'')}"><label>Description</label><textarea id="ed" rows="3">${esc(p.d||'')}</textarea><div id="eer" style="color:#dc2626;font-size:13px"></div><button class="btn w" onclick="saveP('${id}')">Save</button><button class="btn g w" style="margin-top:8px" onclick="closeM()">Cancel</button>`)}
function saveP(id){const n=$('#en').value.trim(),pr=+$('#ep').value,c=$('#ec').value.trim();if(!n||!(pr>0)||!c)return $('#eer').textContent='Fill in name, price and category.';
products=products.map(p=>p.id===id?{...p,n,p:pr,c,u:$('#eu').value.trim(),d:$('#ed').value.trim(),dt:(($('#edt')||{}).value||'').trim(),shop:$('#es').value.trim()||'jhafex.com'}:p);set('products',products);closeM();draw();dash();toast('Saved')}

/* ---------- staff dashboard ---------- */
function dirty(){return[...document.querySelectorAll('#staff input,#staff textarea')].some(i=>i.type==='file'?(i.files&&i.files.length):i.type==='checkbox'?i.checked!==i.defaultChecked:i.value!==i.defaultValue)}
function sTabs(u){const Q=get('users',[]).filter(x=>x.status==='Pending Verification').length,t=[['ord','Orders']];
if(isTop(u))t.push(['apr','Approvals'+(Q?' ('+Q+')':'')]);if(u.role==='ceo')t.push(['team','Team']);
if(u.role==='manager'||isTop(u)){const W=appWait(u);t.push(['app','Applications'+(W?' ('+W+')':'')])}if(canProd(u))t.push(['prod','Products']);if(canShop(u))t.push(['off','Offers']);if(canSite(u))t.push(['site','Site']);return t}
function dash(){const u=me();if(!u)return show('shop');show('staff');const ok=u.status==='Approved';
let h=`<div class="hero"><span class="pill ${ok?'ok':'w'}">${ROLES[u.role]||u.role}: ${esc(u.status)}</span><h1 style="font-size:34px;margin-top:8px">Hello, ${esc(u.name)}</h1><p class="mut">${esc(u.email)}${u.shop?' / '+esc(u.shop):''}</p><button class="btn g sm" onclick="out()">Log out</button></div>`;
if(!ok){$('#staff').innerHTML=h+`<div class="card"><b>${u.status==='Rejected'?'Your application was rejected.':u.status==='Suspended'?'Your account is suspended.':'Waiting for approval.'}</b><p class="mut">You cannot work on the platform until you are approved.</p></div>`;return}
const T=sTabs(u);if(!T.some(x=>x[0]===sTab))sTab='ord';
h+=`<div class="nav">${T.map(x=>`<button class="tab${x[0]===sTab?' on':''}" onclick="sTab='${x[0]}';dash()">${x[1]}</button>`).join('')}</div>`;
h+=({ord:tOrd,apr:tApr,team:tTeam,prod:tProd,off:tOff,site:tSite,app:tApp}[sTab])(u);$('#staff').innerHTML=h}
function tOrd(u){let O=get('orders',[]);if(u.role==='rider')O=O.filter(o=>o.st==='Preparing'||o.rider===u.id);if(u.role==='vendor')O=O.filter(o=>!o.shops||o.shops.includes(u.shop));
return`<h3>Orders</h3>`+(O.map(o=>ordCard(o,u)).join('')||'<p class="mut">No orders right now.</p>')+teamUI(u)}
function tApr(u){const Q=get('users',[]).filter(x=>x.status==='Pending Verification');
return`<h3>Approvals</h3>`+(Q.map(x=>{const can=u.role==='ceo'||x.role!=='admin';return`<div class="card cr"><b>${esc(x.name)}</b> <span class="pill">${ROLES[x.role]||esc(x.role)}</span><br><small>${esc(x.email)}, ${esc(x.phone)}${x.shop?', shop: '+esc(x.shop):''}<br>Documents: ${Object.entries(x.docs||{}).map(([k,v])=>esc(k)+': '+esc(v.split('/').pop())).join(', ')||esc(x.doc||'none')}</small><div class="row">${can?`<button class="btn sm" onclick="decide('${x.id}',1)">Approve</button><button class="btn g sm" onclick="decide('${x.id}',0)">Reject</button>`:'<small>Only the CEO can approve admins.</small>'}${sb?Object.entries(x.docs||{}).filter(([k,v])=>v.startsWith('docs/')).map(([k,v])=>`<button class="btn g sm" onclick="viewDoc('${esc(v)}')">View ${esc(k)}</button>`).join(''):''}</div></div>`}).join('')||'<p class="mut">No pending applications.</p>')}
function tTeam(u){const L=get('users',[]).filter(x=>x.id!==u.id&&x.role!=='ceo'),ST=['Approved','Pending Verification','Rejected','Suspended'];
return`<h3>Team and roles</h3><p class="mut">There is only one CEO (you). Riders, managers and admins can be unlimited. An admin can edit the site (menu, pages, settings) only if you tick the permission.</p>`+(L.map(x=>`<div class="card cr"><b>${esc(x.name)}</b> <small>${esc(x.email)} ${esc(x.phone||'')}</small><label>Role</label><select onchange="uSet('${x.id}','role',this.value)">${['vendor','rider','manager','helpcare','finance','admin'].map(r=>`<option value="${r}"${x.role===r?' selected':''}>${ROLES[r]}</option>`).join('')}</select><label>Status</label><select onchange="uSet('${x.id}','status',this.value)">${ST.map(s=>`<option${x.status===s?' selected':''}>${s}</option>`).join('')}</select>${x.role==='admin'?`<label class="ck"><input type="checkbox" ${x.canEdit?'checked':''} onchange="uSet('${x.id}','canEdit',this.checked)">Allow this admin to edit the site</label>`:''}<button class="btn g sm" onclick="uDel('${x.id}')">Remove</button></div>`).join('')||'<p class="mut">No other team members yet.</p>')}
function uSet(id,k,v){const U=get('users',[]),x=U.find(y=>y.id===id);if(!x||x.role==='ceo')return;x[k]=v;set('users',U);toast('Saved')}
function uDel(id){if(!confirm('Remove this person from the team?'))return;set('users',get('users',[]).filter(x=>x.id!==id));dash()}
function tProd(u){const cats=[...new Set([...products.map(p=>p.c),...menuItems().flatMap(m=>m.t==='cat'?[m.r||m.l,...(m.ch||[]).map(c=>c.r||c.l)]:[])])].filter(Boolean),shops=[...new Set(['jhafex.com',...get('users',[]).filter(x=>x.role==='vendor'&&x.shop).map(x=>x.shop)])];
return`<datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="sl">${shops.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><h3>Add a product</h3><div class="card cr"><p class="mut">List products here with the shop name. A vendor can list his own only after the CEO or an admin approves his request. Every change is recorded (who and when) and only staff can see it.</p><label>Photo</label><label class="btn g w" style="display:block;margin:4px 0 6px">Choose photo<input id="pf" type="file" accept="image/*" hidden onchange="$('#pfn').textContent=this.files[0]?this.files[0].name:''"></label><small id="pfn"></small><label>Or paste a photo link (optional)</label><input id="pimgu" placeholder="https://..."><label>Emoji (shown when there is no photo)</label><input id="pe" value="🛒" maxlength="4"><label>Name</label><input id="pn"><label>Unit (e.g. 1 kg, 12 pcs)</label><input id="pu"><label>Price (৳)</label><input id="pp" type="number" min="1"><label>Description</label><textarea id="pdsc" rows="3"></textarea><label>Category (pick or type a new one)</label><input id="pc" list="cl"><label>Shop / vendor</label><input id="psh" list="sl" value="jhafex.com"><label class="ck"><input type="checkbox" id="pfl">Show in Flash Sales</label><button class="btn w" onclick="addP()">List product</button><div id="er"></div></div><h3>All products (${products.length})</h3>`+products.map(p=>`<div class="card cr"><span>${esc(p.e||'')} <b>${esc(p.n)}</b><br><small>৳${p.p} · ${esc(p.c)} · ${esc(shopLabel(p.shop))}${p.img?' · photo ✓':''}${p.fl?' · flash':''}</small></span><div class="row"><button class="btn g sm" onclick="editP('${p.id}')">Edit</button><label class="btn g sm" style="margin:0">Photo<input type="file" accept="image/*" hidden onchange="chgImg('${p.id}',this)"></label><button class="btn g sm" onclick="togFl('${p.id}')">${p.fl?'Unflash':'Flash'}</button><button class="btn g sm" onclick="delP('${p.id}')">Delete</button></div></div>`).join('')}
function tOff(u){return`<h3>Create an offer package</h3><div class="card cr"><label>Package name</label><input id="on"><label>Emoji</label><input id="oe" value="🎁" maxlength="4"><label>Package price (৳)</label><input id="op" type="number" min="1"><label>Pick the products to include</label>${products.map(p=>`<label class="ck"><input type="checkbox" class="of" value="${p.id}">${esc(p.e||'')} ${esc(p.n)} ৳${p.p}</label>`).join('')}<button class="btn o w" onclick="addO()">Publish offer</button></div><h3>All offers</h3>`+(offers.map(o=>`<div class="card cr row" style="margin-top:0"><span>${esc(o.e)} ${esc(o.n)} <small>৳${o.p}</small></span><button class="btn g sm" onclick="delO('${o.id}')">Delete</button></div>`).join('')||'<p class="mut">No offers yet.</p>')}

const MV=[['shop','Home'],['vo','Offers'],['vd','Coupons'],['vf','Favourites'],['vp','My profile and orders'],['vj','Job corner']];

function refEd(it,i,j){const t=it.t;

if(!sub&&t!=='space'&&t!=='head')h+=`<label>Icon (emoji, optional)</label><input value="${esc(it.ic||'')}" maxlength="4" oninput="mSet(${i},${j},'ic',this.value)">`;

if(!sub&&t!=='space'&&t!=='head')h+=(it.ch||[]).map((c,k)=>itemEd(c,i,k)).join('')+`<button class="btn g sm" onclick="mAd(${i})">+ Add sub-item</button>`;
return h+'</div>'}
function edMenu(){return`<div class="row"><button class="btn sm" onclick="mSv()">Save menu</button><button class="btn g sm" onclick="ED=null;dash()">Reload</button><button class="btn g sm" onclick="mRst()">Reset</button></div><div style="height:12px"></div>`+ED.menu.map((it,i)=>itemEd(it,i,-1)).join('')+`<button class="btn o w" onclick="mAd(-1)">+ Add menu item</button>`}
function mSet(i,j,k,v){const it=j>=0?ED.menu[i].ch[j]:ED.menu[i];if(isCore(it)&&(k==='t'||(k==='r'&&it.t==='view'))){toast('Job corner and Login keep their type. You can rename them.');return dash()}it[k]=v;if(k==='t'){it.r=v==='view'?'shop':v==='page'?((ED.pages[0]||{}).id||''):'';dash()}}
function mMv(i,j,d){const a=j>=0?ED.menu[i].ch:ED.menu,x=j>=0?j:i,k=x+d;if(k<0||k>=a.length)return;[a[x],a[k]]=[a[k],a[x]];dash()}
function mDl(i,j){const it0=j>=0?ED.menu[i].ch[j]:ED.menu[i];if(!it0)return;if(hasCore(it0))return toast('Job corner and Login cannot be removed. You can rename or move them.');if(!typedOk('Remove "'+(it0.l||'this item')+'" from the menu'))return;if(j>=0)ED.menu[i].ch.splice(j,1);else ED.menu.splice(i,1);dash()}
function mAd(i){const n={id:'m'+Date.now()+Math.floor(Math.random()*99),l:'New item',t:'cat',r:'',ic:''};if(i>=0){ED.menu[i].ch=ED.menu[i].ch||[];ED.menu[i].ch.push(n)}else ED.menu.push({...n,ch:[]});dash()}
function mSv(){const has=(a,f)=>a.some(x=>f(x)||has(x.ch||[],f));if(!has(ED.menu,x=>x.t==='staff'))return toast('The Login item must stay in the menu.');if(!has(ED.menu,x=>x.t==='view'&&x.r==='vj'))return toast('The Job corner item must stay in the menu.');saveSite('menu',{items:clone(ED.menu),v:2});toast('Menu saved')}
function mRst(){if(typedOk('Reset the whole menu to the default list')){ED.menu=ensureCore(clone(DEF_MENU));dash()}}
function edPages(){return`<p class="mut">Write plain text. A blank line starts a new paragraph. Use **bold**, lines starting with - for bullets, # for a heading, and [text](https://link) for links. Tap inside the text where the picture should go, then press Add photo to pick one from your phone. To link a word, select the word first, then press Add link and paste a full https:// address. Image link is for a picture that is already online (a direct link ending .jpg, .png or .webp). Saving needs your CEO password.</p><div class="row"><button class="btn sm" onclick="pSv()">Save pages</button><button class="btn g sm" onclick="ED=null;dash()">Reload</button><button class="btn g sm" onclick="pRst()">Reset</button></div><div style="height:12px"></div>`+ED.pages.map((x,i)=>`<div class="card cr"><label>Title</label><input value="${esc(x.t)}" oninput="ED.pages[${i}].t=this.value"><label class="ck"><input type="checkbox" ${x.tab!==false?'checked':''} onchange="ED.pages[${i}].tab=this.checked">Show as a tab on the Help page</label><label>Text</label><div class="row"><button class="btn g sm" onclick="pIns(${i},'photo')">📷 Add photo</button><button class="btn g sm" onclick="pIns(${i},'img')">🖼 Image link</button><button class="btn g sm" onclick="pIns(${i},'link')">🔗 Add link</button></div><textarea id="pgt${i}" rows="8" oninput="ED.pages[${i}].h=this.value">${esc(x.h||'')}</textarea><div class="row"><span><button class="btn g sm" onclick="pMv(${i},-1)">↑</button> <button class="btn g sm" onclick="pMv(${i},1)">↓</button></span><button class="btn g sm" onclick="pDl(${i})">Delete</button></div></div>`).join('')+`<button class="btn o w" onclick="pAd()">+ Add page</button>`}
function pMv(i,d){const k=i+d,a=ED.pages;if(k<0||k>=a.length)return;[a[i],a[k]]=[a[k],a[i]];dash()}
function pDl(i){if(typedOk('Delete the page "'+((ED.pages[i]||{}).t||'')+'"'.replace('\,'))){ED.pages.splice(i,1);dash()}}
function pAd(){ED.pages.push({id:'pg'+Date.now(),t:'New page',h:'',tab:true});dash()}
function pSv(){saveSite('pages',{items:clone(ED.pages)});toast('Pages saved')}
function pRst(){if(typedOk('Reset all help pages to the default text')){ED.pages=clone(DEF_PAGES);dash()}}
const SF=[['clubName','Club name (top of menu)'],['clubPts','Club points text'],['clubBtn','Club button text'],['wa','WhatsApp number (880..., digits only)'],['fb','Facebook link'],['yt','YouTube link'],['banner','Help page banner picture link (https, optional)'],['delT','Delivery charge threshold (৳)'],['delLo','Delivery charge below threshold (৳)'],['delHi','Delivery charge at or above threshold (৳)'],['cExtra','Extra delivery charge for other-area (custom) address (৳)'],['bk','bKash number (to receive payments)'],['ng','Nagad number (to receive payments)'],['cardUrl','Card payment link (https, from your payment gateway)'],['rPay','Rider pay per delivery (৳, flat)'],['rPct','Rider share of delivery charge (%)'],['maxDay','Max orders from one phone number per day (default 5)']];
function edSet(){return`<div class="card cr">${SF.map(f=>`<label>${f[1]}</label><input value="${esc(ED.set[f[0]]==null?'':ED.set[f[0]])}" oninput="ED.set['${f[0]}']=this.value">`).join('')}<label>Other-area (custom) delivery address</label><select onchange="ED.set.cOn=this.value==='1'"><option value="1"${ED.set.cOn===false?'':' selected'}>On (customer can type another area, extra charge)</option><option value="0"${ED.set.cOn===false?' selected':''}>Off (only our delivery areas)</option></select><label>Delivery OTP</label><select onchange="ED.set.otp=this.value==='1'"><option value="0"${ED.set.otp?'':' selected'}>Off</option><option value="1"${ED.set.otp?' selected':''}>On (customer gives a 4-digit code to the rider)</option></select><button class="btn w" onclick="sSave()">Save settings</button></div>`}
function sSave(){const s={...ED.set};['delT','delLo','delHi','cExtra'].forEach(k=>s[k]=Math.max(0,+s[k]||0));s.wa=String(s.wa||'').replace(/\D/g,'')||DEF_SET.wa;
['fb','yt'].forEach(k=>{s[k]=String(s[k]||'').trim();if(!/^https:\/\//.test(s[k]))s[k]=DEF_SET[k]});s.banner=/^https:\/\//.test(String(s.banner||'').trim())?String(s.banner).trim():'';
['clubName','clubPts','clubBtn'].forEach(k=>s[k]=String(s[k]||'').trim()||DEF_SET[k]);s.otp=!!s.otp;['bk','ba'].forEach(k=>s[k]=String(s[k]||'').trim()||DEF_SET[k]);s.bn=String(s.bn||'').trim();ED.set=s;saveSite('main',s);toast('Settings saved');dash()}
renderMenu();draw();cartUI();acctUI();
</script>
<script>
// ---- Step 1: Job corner (criteria, areas, apply form, manager then admin approval) ----
const DEF_CRIT=`**Who can apply**
- Age 18 or older.
- Valid NID or birth certificate.
- Working phone number.

**Conditions**
- All information and documents must be true. False information cancels the application.
- Applying does not guarantee a job.
- Your application first goes to the manager of the area you choose, then to the admin for final approval.
- Selected people must follow company rules and local laws.`;
const RL4={vendor:'Vendor',rider:'Rider',manager:'Area Manager',admin:'Admin'};
const DEFROLE={
vendor:`**Vendor: who can apply**
- Own or run a shop that sells genuine products.
- Valid trade license or NID.
- Can pack orders on time and keep stock updated.
- Choose your zone, area and local area.`,
rider:`**Rider: who can apply**
- Age 18 or older, with a smartphone.
- Own bike or cycle. Driving license if you use a motorbike.
- Knows the roads of your local area.
- Hands over COD cash the same day.
- Choose your zone, area and local area.`,
manager:`**Area Manager: who can apply**
- Experience in leading a team or running operations.
- Can manage riders, vendors and COD cash of one area.
- Lives in or near the area.
- Choose your zone and area.`,
admin:`**Admin: who can apply**
- Experience in operations, accounts or management.
- Can check and decide applications and staff of a whole zone.
- Honest and trusted. Final approval is by the CEO.
- Choose your zone.`,
helpcare:`**Customer Care: who can apply**
- Clear and polite talking, in Bengali and English.
- Patient with complaints, returns and refunds.
- Works from the support desk. No zone or area needed.`,
vprod:`**Vendor: listing your own products**
- You have been working as an approved vendor of this shop.
- Prices and photos must be true and match the real product.
- Keep stock and prices up to date.
- Every change you make is recorded with your name and time.
- The CEO or an admin can withdraw this permission at any time.`};
const DEFJOB={open:true,ver:1,crit:DEF_CRIT,areas:[],zones:[],rcrit:{},forms:{}};
const critOf=(C,r)=>(C.rcrit&&C.rcrit[r])||DEFROLE[r]||C.crit||DEF_CRIT;
const jobCfg=()=>{const B={...DEFJOB,...(siteDoc('jobcfg')||{})},L=siteDoc('lareas');return{...B,areas:L?(L.areas||[]):(B.areas||[]),locals:L?(L.locals||[]):[]}};
const zAdm=(a,u)=>u.role==='ceo'||(((jobCfg().zones||[]).find(z=>z.id===a.zone)||{}).adm||[]).includes(u.id);
const canAct=(a,u)=>u.role==='manager'?(a.mgr===u.id&&a.st==='Pending Manager'):u.role==='ceo'?(a.st==='Pending CEO'||a.st==='Pending Admin'):u.role==='admin'?(a.st==='Pending Admin'&&zAdm(a,u)):false;
const canEd=(a,u)=>false&&!!a.ed&&a.edst==='Pending'&&(u.role==='ceo'||(u.role==='manager'&&a.mgr===u.id&&['rider','vendor'].includes(a.role))||(u.role==='admin'&&a.role==='manager'&&zAdm(a,u)));
const jEdBtn=a=>''&&a.edst==='Pending'?'<p class="mut" style="margin:6px 0 0"><small>Edit request is waiting for approval</small></p>':`${a.edst==='Rejected'?'<small>Last edit was rejected. </small>':''}<button class="btn g sm" onclick="jEd('${esc(a.id)}')">Request edit</button>`;
function jEd(id){const L=get('applications',[]),a=L.find(x=>x.id===id&&x.uid===myUid());if(!a||a.edst==='Pending')return;
const p=prompt('Phone number',a.phone);if(p===null)return;const phone=ph(p);if(!phone)return toast('Enter a valid phone number');
const em=prompt('Email (optional)',a.email||'');if(em===null)return;const n=prompt('Note',a.note||'');if(n===null)return;
a.ed={phone,email:em.trim().toLowerCase(),note:n.trim().slice(0,1500)};a.edst='Pending';set('applications',L);toast('Edit request sent');dJob(true)}
function edBox(a){return`<div class="card" style="margin:8px 0"><b>Edit request</b><br><small>Phone: ${esc(a.phone)} -> ${esc(a.ed.phone)}<br>Email: ${esc(a.email||'-')} -> ${esc(a.ed.email||'-')}<br>Note: ${esc(a.ed.note||'-')}</small><div class="row"><button class="btn sm" onclick="edAct('${esc(a.id)}',1)">Approve edit</button><button class="btn g sm" onclick="edAct('${esc(a.id)}',0)">Reject edit</button></div></div>`}
function edAct(id,ok){const u=me(),L=get('applications',[]),a=L.find(x=>x.id===id);if(!u||u.status!=='Approved'||!a||!canEd(a,u))return toast('Not allowed');
if(ok){a.phone=a.ed.phone;a.email=a.ed.email;a.note=a.ed.note}a.edst=ok?'Approved':'Rejected';a.edby=u.name;a.edt=Date.now();set('applications',L);toast(ok?'Edit approved':'Edit rejected');dash()}
function crAsk(){const J=ED.job,C=jobCfg();return Object.keys(RL4).map(r=>`<div class="card cr"><label>Propose criteria: ${RL4[r]}</label><textarea rows="5" oninput="ED.job.rcrit.${r}=this.value">${esc((J.rcrit||{})[r]||critOf(C,r))}</textarea><button class="btn sm" onclick="jCrReq('${r}')">Send to CEO for approval</button></div>`).join('')}
function jCrReq(r){const u=me();if(!canSite(u)||u.role!=='admin')return toast('Not allowed');const t=String((ED.job.rcrit||{})[r]||'').trim();if(t.length<10)return toast('Write the new criteria first.');
saveSite('cr_'+Date.now().toString(36)+Math.floor(Math.random()*99),{role:r,text:t,by:u.id,byn:u.name,st:'Pending',t:Date.now()});toast('Sent to CEO')}
function crPend(){const L=get('site',[]).filter(x=>/^cr_/.test(x.id)&&x.st==='Pending');return`<h3>Criteria change requests (${L.length})</h3>`+(L.map(x=>`<div class="card cr"><b>${esc(RL4[x.role]||x.role)}</b> <small>by ${esc(x.byn||'')}</small><p style="white-space:pre-line">${esc(x.text)}</p><div class="row"><button class="btn sm" onclick="crAct('${esc(x.id)}',1)">Approve</button><button class="btn g sm" onclick="crAct('${esc(x.id)}',0)">Reject</button></div></div>`).join('')||'<p class="mut">No requests.</p>')}
function crAct(id,ok){const u=me(),x=get('site',[]).find(y=>y.id===id);if(!u||u.role!=='ceo'||u.status!=='Approved'||!x||x.st!=='Pending')return toast('Not allowed');
if(ok){const C=jobCfg();saveSite('jobcfg',{open:!!C.open,zones:C.zones||[],crit:C.crit||DEF_CRIT,rcrit:{...(C.rcrit||{}),[x.role]:x.text},forms:C.forms||{},ver:(+C.ver||1)+1})}
saveSite(id,{...x,st:ok?'Approved':'Rejected',dby:u.name,dt:Date.now()});ED=null;toast(ok?'Criteria updated':'Rejected');dash()}
function fmEd(){const F=ED.job.forms=ED.job.forms||{};return Object.keys(RL4).map(r=>{const L=F[r]=F[r]||[];return`<div class="card cr"><label>Extra form fields: ${RL4[r]}</label>`+L.map((f,i)=>`<div class="card" style="margin:6px 0"><input value="${esc(f.l||'')}" placeholder="Question" oninput="ED.job.forms.${r}[${i}].l=this.value"><select onchange="ED.job.forms.${r}[${i}].t=this.value"><option value="text"${f.t==='text'?' selected':''}>Short text</option><option value="area"${f.t==='area'?' selected':''}>Long text</option><option value="sel"${f.t==='sel'?' selected':''}>Choice</option></select><input value="${esc(f.o||'')}" placeholder="Choices: a,b,c (for Choice)" oninput="ED.job.forms.${r}[${i}].o=this.value"><label class="ck"><input type="checkbox" ${f.q?'checked':''} onchange="ED.job.forms.${r}[${i}].q=this.checked"> Required</label><button class="btn g sm" onclick="fDel('${r}',${i})">Remove</button></div>`).join('')+`<button class="btn o w" onclick="fAdd('${r}')">+ Add field</button></div>`}).join('')}
function fAdd(r){ED.job.forms[r].push({id:'f'+Date.now().toString(36)+Math.floor(Math.random()*99),l:'',t:'text',o:'',q:false});dash()}
function fDel(r,i){ED.job.forms[r].splice(i,1);dash()}
function autoAssign(a){const me0=me(),AU=get('users',[]),U=AU.find(x=>x.status==='Approved'&&x.role===a.role&&ph(x.phone||'')===a.phone);if(!U)return toast('Approved. The applicant can now create an account from Job corner.');
const C=jobCfg();
if((a.role==='manager'||a.role==='admin')&&(!me0||me0.role!=='ceo'))return toast('Approved. Only the CEO can place a manager or admin: Site > Job corner.');
if(a.role==='manager'){saveSite('lareas',{areas:(C.areas||[]).map(r=>r.id===a.area&&!r.mg?{...r,mg:U.id,mn:U.name}:r),locals:C.locals||[]})}
else if(a.role==='admin'){saveSite('jobcfg',{open:!!C.open,zones:(C.zones||[]).map(z=>z.id===a.zone?{...z,adm:[...new Set([...(z.adm||[]),U.id])]}:z),crit:C.crit||DEF_CRIT,rcrit:C.rcrit||{},forms:C.forms||{},ver:+C.ver||1})}
else{U.zone=a.zone||'';U.area=a.area||'';U.local=a.local||'';set('users',AU)}
toast('Approved and assigned: '+U.name)}
function jRef(){const C=jobCfg(),r=$('#jr').value,z=$('#jz').value;$('#jcr').innerHTML=fmt(critOf(C,r));const jx=$('#jx');if(jx.dataset.r!==r){jx.dataset.r=r;jx.innerHTML=((C.forms||{})[r]||[]).map(f=>`<label>${esc(f.l)}${f.q?' *':''}</label>`+(f.t==='area'?`<textarea data-f="${esc(f.id)}" rows="3" maxlength="500"></textarea>`:f.t==='sel'?`<select data-f="${esc(f.id)}"><option value="">Select</option>${String(f.o||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:`<input data-f="${esc(f.id)}" maxlength="200">`)).join('')}const sz=['admin','manager','vendor','rider'].includes(r),sa=['manager','vendor','rider'].includes(r),sl=['vendor','rider'].includes(r),a0=$('#ja').value,l0=$('#jl').value;
$('#jzw').style.display=sz?'':'none';$('#jaw').style.display=sa?'':'none';$('#jlw').style.display=sl?'':'none';
const ar=(C.areas||[]).filter(a=>a.zone===z&&(r!=='manager'||!a.mg));
$('#ja').innerHTML=`<option value="">${ar.length?'Select area':(z?(r==='manager'?'No free area in this zone':'No area added in this zone yet'):'Select a zone first')}</option>`+ar.map(a=>`<option value="${esc(a.id)}">${esc(a.n)}</option>`).join('');$('#ja').value=ar.some(a=>a.id===a0)?a0:'';if(ar.length===1&&!$('#ja').value)$('#ja').value=ar[0].id;
const AR=C.areas||[],ZN=C.zones||[],lo=(C.locals||[]).filter(l=>l.area===$('#ja').value);
$('#jl').innerHTML=`<option value="">${lo.length?'Select local area':($('#ja').value?'No local area here (not needed)':'Select an area first')}</option>`+lo.map(l=>{const a=AR.find(x=>x.id===l.area)||{},zz=ZN.find(x=>x.id===a.zone)||{};return`<option value="${esc(l.id)}">${esc(l.n)}</option>`}).join('');$('#jl').value=lo.some(l=>l.id===l0)?l0:'';if(lo.length===1&&!$('#jl').value)$('#jl').value=lo[0].id}
const JST={'Pending Manager':['With area manager','w'],'Pending Admin':['With admin','w'],'Pending CEO':['With CEO','w'],'Approved':['Approved','ok'],'Rejected':['Rejected','']};
const jPill=x=>{const j=JST[x]||[x,''];return`<span class="pill ${j[1]}">${esc(j[0])}</span>`};
const myUid=()=>(window.fbUid&&fbUid())||'';

function jMy(){const L=get('applications',[]).filter(a=>a.uid===myUid()).sort((x,y)=>(y.t||0)-(x.t||0));
return`<h3 style="margin-top:24px">My applications</h3>`+(L.map(a=>`<div class="card cr"><div class="row" style="margin:0"><b>${esc(RL4[a.role]||'Job')} / ${esc(a.areaName||'')}${a.localName?' / '+esc(a.localName):''}</b>${jPill(a.st)}</div><small>${new Date(a.t).toLocaleDateString()}</small>${a.mnote?`<p style="margin:6px 0 0"><small>Manager: ${esc(a.mnote)}</small></p>`:''}${a.anote?`<p style="margin:6px 0 0"><small>Admin: ${esc(a.anote)}</small></p>`:''}${a.st==='Approved'&&!a.used&&a.code?`<div class="card" style="margin:8px 0"><b>You are approved!</b><p class="mut" style="margin:4px 0">Create your staff account, set your password and upload your full profile.</p><button class="btn o w" onclick="joinModal('${esc(a.id)}')">Create my account</button></div>`:''}${a.used?'<p class="mut" style="margin:6px 0 0"><small>Account created. Log in from the Staff button.</small></p>':''}${jEdBtn(a)}</div>`).join('')||'<p class="mut">You have not applied yet.</p>')}
function dJob(force){const C=jobCfg(),c=cust(),ar=C.areas||[];
if(!force&&jFormDirty()&&$('#jmy')){$('#jmy').innerHTML=jMy();return}
let h=`<div class="hhero"><h2>Job corner</h2></div><div class="card cr" style="margin-top:16px"><h3>Criteria and conditions</h3><small>Version ${+C.ver||1}</small><div class="pgt" id="jcr" style="margin-top:8px">${fmt(C.crit)}</div></div>`;

${my||ad?`<input id="nt${esc(a.id)}" placeholder="Remark (optional)" maxlength="300"><div class="row"><button class="btn sm" onclick="appAct('${esc(a.id)}',1)">${my?'Approve and send to admin':'Approve'}</button><button class="btn g sm" onclick="appAct('${esc(a.id)}',0)">Reject</button></div>`:''}

<script>
// ---- Step 8: invoices, vendor bills, expense claims, receipts (all downloadable) ----
(function(){
TABN.vinv='Bills and invoices';TABN.claim='Expense claims';TABN.rcp='Receipts';
const FD=()=>(mem.fdocs||[]).slice().sort((a,b)=>b.t-a.t),LG=()=>get('ledger',[]);
const stp=s=>`<span class="pill ${['Paid','Verified'].includes(s)?'ok':'w'}">${esc(s)}</span>`;

/* ---------- customer sales invoice ---------- */
const invNo=o=>'INV-'+o.id;
const invBody=o=>{const s=sum((o.items||[]).map(i=>i.p*i.q)),pm=o.pay&&o.pay.m!=='cod'?o.pay.m+' ('+o.pay.st+(o.pay.trx?', '+o.pay.trx:'')+')':'Cash on delivery';

const invText=o=>'jhafex.com invoice '+invNo(o)+'\n'+o.cust.name+'\n'+(o.items||[]).map(i=>i.n+' x'+i.q+' = '+tk(i.p*i.q)).join('\n')+'\nTotal: '+tk(o.total)+'\nStatus: '+o.st;
const rcOk=o=>o.pay&&o.pay.m!=='cod'?o.pay.st==='Verified':o.st==='Delivered';
window.invShow=id=>{const o=get('orders',[]).find(x=>x.id===id);if(!o)return;const t=encodeURIComponent(invText(o)),ph=o.cust.phone,stf=!!me(),em=o.cust.email;
openM(`<div>${invBody(o)}</div><div class="row" style="justify-content:flex-start;gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="invPrint('${id}')">Download PDF</button><a class="btn g sm" target="_blank" rel="noopener" href="https://wa.me/${stf?'88'+esc(ph):''}?text=${t}">WhatsApp</a>${em?`<a class="btn g sm" href="mailto:${esc(em)}?subject=${encodeURIComponent('Invoice '+invNo(o))}&body=${t}">Email</a>`:''}<a class="btn g sm" href="sms:${esc(ph)}?body=${t}">SMS</a>${rcOk(o)?`<button class="btn g sm" onclick="rcOrder('${id}')">Payment receipt</button>`:''}</div><button class="btn g w" style="margin-top:10px" onclick="closeM()">Close</button>`)};
window.invPrint=id=>{const o=get('orders',[]).find(x=>x.id===id);o&&printDoc(invNo(o),invBody(o))};
const _pl=place;place=function(){const n=get('orders',[]).map(o=>o.id);_pl();const o=get('orders',[]).find(x=>!n.includes(x.id));if(o)setTimeout(()=>invShow(o.id),200)};
const _dp=dProf;dProf=function(){_dp();const c=cust();if(!c)return;const L=get('orders',[]).filter(o=>o.uid===((window.fbUid&&fbUid())||'')&&o.st!=='Cancelled');
if(L.length)$('#vp').insertAdjacentHTML('beforeend','<h3>Invoices</h3>'+L.map(o=>`<div class="card cr"><div class="row" style="margin:0"><b>${invNo(o)}</b><b>${tk(o.total)}</b></div><small>${fdate(o.t)} / ${esc(o.st)}</small><div class="row" style="justify-content:flex-start;gap:8px"><button class="btn sm" onclick="invShow('${o.id}')">View invoice</button><button class="btn g sm" onclick="invPrint('${o.id}')">Download PDF</button></div></div>`).join(''))};
const _oc=ordCard;ordCard=function(o,u){return _oc(o,u).replace(/<\/div>$/,`<div style="margin-top:8px"><button class="btn g sm" onclick="invShow('${o.id}')">Invoice</button></div></div>`)};

/* ---------- payment receipts ---------- */
const rBody=r=>`<h3 style="margin:0">Payment receipt</h3><p class="k">jhafex.com / ${esc(r.no)} / ${fdate(r.t)}</p><table class="t"><tr><th>${r.dir==='in'?'Received from':'Paid to'}</th><td>${esc(r.who||'')}</td></tr><tr><th>For</th><td style="white-space:normal">${esc(r.desc||'')}</td></tr><tr><th>Amount</th><td><b>${tk(r.amt)}</b></td></tr><tr><th>Method</th><td>${esc(ACC[r.acc]||r.acc||'')}</td></tr>${r.ref?`<tr><th>Reference</th><td>${esc(r.ref)}</td></tr>`:''}</table><p class="k">This receipt is generated by the jhafex.com accounts system.</p>`;
window.rcShow=r=>{window._rcur=r;const t=encodeURIComponent('jhafex.com receipt '+r.no+'\n'+(r.dir==='in'?'Received from ':'Paid to ')+r.who+'\n'+r.desc+'\nAmount: '+tk(r.amt));
openM(rBody(r)+`<div class="row" style="justify-content:flex-start;gap:6px"><button class="btn sm" onclick="printDoc('Receipt '+_rcur.no,'');">Download PDF</button><a class="btn g sm" target="_blank" rel="noopener" href="https://wa.me/?text=${t}">WhatsApp</a></div><button class="btn g w" style="margin-top:10px" onclick="closeM()">Close</button>`);
$('#md').querySelector('button.btn.sm').onclick=()=>printDoc('Receipt '+r.no,rBody(r))};
window.rcOrder=id=>{const o=get('orders',[]).find(x=>x.id===id);if(!o)return;const p=o.pay&&o.pay.m!=='cod';rcShow({no:'RC-'+o.id,t:p?(o.pay.vt||o.t):((o.log||[]).filter(x=>x.s==='Delivered').pop()||{t:o.t}).t,who:o.cust.name,amt:o.total,acc:p?(o.pay.m==='bank'?'bank':'bkash'):'cash',ref:p?o.pay.trx:'',desc:'Order '+o.id,dir:'in'})};
const rcpts=u=>{const R=[],top=isFin(u);
get('settlements',[]).filter(s=>s.st==='Paid'&&(top||s.v===u.id)).forEach(s=>R.push({no:'RC-'+s.id,t:s.dt||s.t,who:s.shop,amt:s.amt,acc:s.acc||'bank',ref:s.ref,desc:'Vendor settlement',dir:'out'}));
FD().filter(f=>f.st==='Paid'&&(top||f.uid===u.id)).forEach(f=>R.push({no:'RC-'+f.id,t:f.pt||f.t,who:f.name,amt:f.amt,acc:f.acc,desc:(f.k==='vinv'?'Vendor invoice ':'Expense claim ')+(f.no||f.cat||''),dir:'out'}));
const rm=l=>({no:'RC-'+l.id,t:l.ct||l.t,who:l.mname,amt:l.amt,acc:l.acc,desc:'COD handover '+(l.areaName||''),dir:'in',ref:l.ref});
if(top){LG().filter(l=>l.k==='bill'&&l.st==='Paid'&&!l.ref).forEach(b=>R.push({no:'RC-'+b.id,t:b.pt||b.t,who:b.who,amt:b.amt,acc:b.acc,desc:b.type+(b.month?' '+b.month:''),dir:'out'}));
LG().filter(l=>l.k==='remit'&&l.st==='Confirmed').forEach(l=>R.push(rm(l)));
get('orders',[]).filter(o=>o.pay&&o.pay.m!=='cod'&&o.pay.st==='Verified').forEach(o=>R.push({no:'RC-'+o.id,t:o.pay.vt||o.t,who:o.cust.name,amt:o.total,acc:o.pay.m==='bank'?'bank':'bkash',desc:'Order '+o.id,dir:'in',ref:o.pay.trx}));
get('tickets',[]).filter(k=>k.refund&&k.refund.st==='Refunded').forEach(k=>R.push({no:'RC-'+k.id,t:k.refund.pt||k.t,who:k.cust.name||k.cust.phone,amt:k.refund.amt,acc:k.refund.acc||'cash',desc:'Refund '+(k.order?'order '+k.order:''),dir:'out',ref:k.refund.ref}))}
else if(u.role==='manager')LG().filter(l=>l.k==='remit'&&l.st==='Confirmed').forEach(l=>R.push(rm(l)));
else if(u.role==='rider')get('orders',[]).filter(o=>o.rider===u.id&&o.cod&&o.cod.st==='Confirmed').forEach(o=>R.push({no:'RC-C'+o.id,t:o.cod.ct||o.t,who:u.name,amt:o.cod.amt,acc:'cash',desc:'COD cash handed over, order '+o.id,dir:'in'}));
return R.sort((a,b)=>b.t-a.t)};
window.tRcp=u=>{const R=window._rcl=rcpts(u);return`<h3>Payment receipts</h3><p class="mut">A receipt is made after each payment is completed. Open it to download or send.</p>`+(R.slice(0,60).map((r,i)=>`<div class="card cr"><div class="row" style="margin:0"><b>${esc(r.no)}</b><b>${tk(r.amt)}</b></div><small>${fdate(r.t)} / ${r.dir==='in'?'Received from':'Paid to'} ${esc(r.who||'')} / ${esc(r.desc)}</small><div style="margin-top:6px"><button class="btn sm" onclick="rcShow(_rcl[${i}])">View / Download</button></div></div>`).join('')||'<p class="mut">No receipts yet.</p>')};

/* ---------- vendor invoice + employee claim (upload, finance verifies) ---------- */
const slots=a=>a.map(k=>`<label>${k}</label><label class="btn g w" style="display:block;margin:4px 0"><span>Choose file</span><input class="fsl" data-k="${k}" type="file" accept=".pdf,image/*" hidden onchange="jSlot(this)"></label><small class="mut"></small>`).join('')+'<small>Each file up to 5 MB</small>';
const fdList=L=>L.map(f=>`<div class="card cr"><div class="row" style="margin:0"><b>${esc(f.no||f.cat||'')} / ${tk(f.amt)}</b>${stp(f.st)}</div><small>${fdate(f.t)}${f.note?' / '+esc(f.note):''}</small>${f.frem?`<p style="margin:6px 0 0"><small>Finance: ${esc(f.frem)}</small></p>`:''}<div style="margin-top:6px">${(f.docs||[]).map((d,i)=>`<button class="btn g sm" style="margin:2px 4px 2px 0" onclick="fdDoc('${f.id}',${i})">${esc((d.k||'File')+': '+d.n)}</button>`).join('')}</div></div>`).join('')||'<p class="mut">Nothing submitted yet.</p>';
window.fdDoc=(id,i)=>{const f=FD().find(x=>x.id===id),d=f&&(f.docs||[])[i];if(!d)return;if(!/^docs\//.test(d.p)||!sb)return toast('This file is not stored online');viewDoc(d.p)};
const fdForm=k=>card2(k==='vinv'?'Upload a bill / challan':'Submit an expense claim',(k==='vinv'?'<label>Invoice number</label><input id="fd_n" maxlength="30">':`<label>Type</label><select id="fd_c">${EXC.map(c=>`<option>${c}</option>`).join('')}</select>`)+`<label>Amount (৳)</label><input id="fd_a" type="number" inputmode="numeric"><label>${k==='vinv'?'Items / note':'Reason for the expense'}</label><textarea id="fd_t" rows="2" maxlength="300"></textarea>`+slots(k==='vinv'?['Bill','Challan']:['Bill / receipt','Proof'])+`<div id="fde" style="color:#dc2626;font-size:13px;min-height:18px"></div><button class="btn w" id="fd_b" onclick="fdSubmit('${k}')">Send to Finance</button>`);
window.tVinv=u=>u.role!=='vendor'?'':`<h3>Bills and invoices</h3><p class="mut">Upload your purchase bill and challan. The Finance team checks it, then the owner approves payment.</p>`+fdForm('vinv')+secH('My submissions')+fdList(FD().filter(f=>f.k==='vinv'&&f.uid===u.id));
window.tClaim=u=>`<h3>Expense claims</h3><p class="mut">Submit your work expense with the bill and proof. Finance checks it and the owner approves payment.</p>`+fdForm('claim')+secH('My claims')+fdList(FD().filter(f=>f.k==='claim'&&f.uid===u.id));
window.fdSubmit=async k=>{const u=me(),e=m=>$('#fde').textContent=m,amt=Math.round(+$('#fd_a').value),no=($('#fd_n')||{}).value||'',F=[...document.querySelectorAll('.fsl')].filter(i=>i.files[0]).map(i=>({f:i.files[0],k:i.dataset.k}));
if(!u||u.status!=='Approved')return;if(!(amt>0))return e('Enter the amount.');if(k==='vinv'&&no.trim().length<2)return e('Enter the invoice number.');if(!F.length)return e('Upload the bill or receipt.');
const b=$('#fd_b');b.disabled=true;e('Uploading...');const docs=[];try{for(const x of F)docs.push({k:x.k,n:x.f.name.slice(0,60),p:await up(x.f,'docs')})}catch(x){b.disabled=false;return e('Upload failed. Try smaller files.')}
const d={id:rid('FD'),k,uid:u.id,name:u.name,role:u.role,shop:u.shop||'',no:no.trim().slice(0,30),cat:($('#fd_c')||{}).value||'',amt,note:$('#fd_t').value.trim().slice(0,300),docs,st:'Submitted',t:Date.now()};
fbSet('fdocs',d.id,d).then(()=>{toast('Sent to Finance');dash()}).catch(x=>{b.disabled=false;e('Failed: '+x.code)})};

/* ---------- finance side: verify, then owner approval, then paid ---------- */
window.fdInv=u=>{if(!isFin(u))return'';const A=FD().filter(f=>f.st==='Submitted'),V=FD().filter(f=>f.st==='Verified'),H=FD().filter(f=>['Paid','Rejected'].includes(f.st)).slice(0,20),
row=(f,x)=>`<div class="card cr"><div class="row" style="margin:0"><b>${f.k==='vinv'?'Vendor bill':'Claim'} / ${tk(f.amt)}</b>${stp(f.st)}</div><small>${esc(f.name)}${f.shop?' ('+esc(f.shop)+')':''} / ${esc(f.no||f.cat||'')} / ${fdate(f.t)}${f.note?' / '+esc(f.note):''}</small><div style="margin:6px 0">${(f.docs||[]).map((d,i)=>`<button class="btn g sm" style="margin:2px 4px 2px 0" onclick="fdDoc('${f.id}',${i})">${esc((d.k||'File')+': '+d.n)}</button>`).join('')}</div>${x}</div>`;
return`<h3 style="font-size:16px">Vendor bills and expense claims</h3>`+secH('To check ('+A.length+')')+(A.map(f=>row(f,f.uid===u.id?'<small>You cannot check your own claim.</small>':`<input id="fr${f.id}" placeholder="Remark (needed to reject)" maxlength="200"><div class="row"><button class="btn sm" onclick="fdVerify('${f.id}',1)">Verified, send for owner approval</button><button class="btn g sm" onclick="fdVerify('${f.id}',0)">Reject</button></div>`)).join('')||'<p class="mut">Nothing to check.</p>')+secH('Verified, with owner / payment ('+V.length+')')+(V.map(f=>row(f,'<small>See Payment approval.</small>')).join('')||'<p class="mut">None.</p>')+secH('History')+(H.map(f=>row(f,f.frem?`<small>${esc(f.frem)}</small>`:'')).join('')||'<p class="mut">No records yet.</p>')};
window.fdVerify=(id,ok)=>{const u=me(),f=FD().find(x=>x.id===id);if(!isFin(u)||!f||f.st!=='Submitted'||f.uid===u.id)return;const r=(($('#fr'+id)||{}).value||'').trim();
if(!ok){if(r.length<3)return toast('Write the reason to reject');fbSet('fdocs',id,{...f,st:'Rejected',frem:r,vby:u.name,vt:Date.now()});return toast('Rejected')}
const l=LG();l.unshift({id:rid('LG'),t:Date.now(),by:u.id,byName:u.name,k:'bill',type:f.k==='vinv'?'Vendor Bill':'Employee Claim',who:f.shop||f.name,amt:f.amt,note:(f.no||f.cat||'')+(f.note?' - '+f.note:''),ref:f.id,st:'Awaiting Approval'});set('ledger',l);
fbSet('fdocs',id,{...f,st:'Verified',frem:r,vby:u.name,vt:Date.now(),bill:l[0].id});toast('Sent for owner approval')};
const _bp=window.billPay;window.billPay=id=>{const b=LG().find(x=>x.id===id);_bp(id);if(b&&b.ref&&b.st==='Paid'){const f=FD().find(x=>x.id===b.ref);f&&fbSet('fdocs',f.id,{...f,st:'Paid',pt:b.pt,acc:b.acc,pby:b.pby})}};
const _ba=window.billAct;window.billAct=(id,ok)=>{const b=LG().find(x=>x.id===id);_ba(id,ok);if(b&&b.ref&&b.st==='Rejected'){const f=FD().find(x=>x.id===b.ref);f&&fbSet('fdocs',f.id,{...f,st:'Rejected',frem:'Owner rejected this payment'})}};

/* ---------- tabs ---------- */

<script>
/* ---------- Customer dashboard services: tracking, cancel, reorder, support, club points, alerts ---------- */
(function(){
const STEPS=['Pending','Preparing','Out for Delivery','Delivered'],TYPES=['Complaint','Delivery inquiry','Return','Exchange','Cancellation','Refund'];
const uid=()=>(window.fbUid&&fbUid())||'';
const myOrd=()=>{const c=cust();return c?get('orders',[]).filter(o=>o.uid&&o.uid===((window.fbUid&&fbUid())||'')):[]};
const myTk=()=>get('tickets',[]).filter(k=>k.src==='customer'&&k.by===uid());
const ft=t=>t?new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const money=n=>'৳'+Math.round(+n||0).toLocaleString('en-US');
const sysNote=x=>/^(Escalated to|Reopened|Resolved|Refund )/.test(x||'');
const resolve=i=>{const p=products.find(x=>x.n===i.n&&(x.shop||'')===(i.s||''));if(p)return{k:p.id,p};for(const b of products){if((b.shop||'')!==(i.s||''))continue;const z=(b.sizes||[]).findIndex(t=>b.n+' ('+t.l+')'===i.n);if(z>=0)return{k:b.id+'::'+z,p:b,sized:1}}return null};

function track(o){
 if(['Cancelled','Returned'].includes(o.st))return`<p style="margin:8px 0 0;color:#dc2626"><small><b>${o.st==='Cancelled'?'This order was cancelled.':'This order was returned.'}</b></small></p>`;
 const i=o.st==='Delivery Failed'?2:STEPS.indexOf(o.st==='Left Store'?'Out for Delivery':o.st);
 return`<div style="display:flex;gap:6px;margin:10px 0 2px">${STEPS.map((s,j)=>`<div style="flex:1;text-align:center"><div style="height:6px;border-radius:99px;background:${j<=i?'var(--b)':'var(--line)'}"></div><small style="font-size:11px;${j===i?'font-weight:800;color:var(--b)':''}">${s==='Out for Delivery'?'On the way':s}</small></div>`).join('')}</div>${o.st==='Delivery Failed'?'<p style="margin:4px 0 0;color:#b45309"><small>Delivery was not completed. Our team will contact you.</small></p>':''}`}
function history(o){
