<script>

function togFav(id){let f=get('fav',[]);f=f.includes(id)?f.filter(x=>x!==id):[...f,id];set('fav',f);pview(id)}
function pview(id){const p=PR(id);if(!p)return;const q=cart[id]||0,fv=get('fav',[]).includes(id);
openM(`<div class="pi big">${pimg(p)}</div><div class="row" style="margin-top:12px"><h3 style="margin:0">${esc(p.n)}</h3><button class="ib" style="flex:none" onclick="togFav('${id}')" aria-label="Favourite">${fv?'❤️':'🤍'}</button></div>${p.u?`<small>${esc(p.u)}</small>`:''}<div class="row"><b style="font-size:22px">৳${p.p}</b>${q?`<div class="row" style="margin:0"><button class="btn g sm" onclick="chg('${id}',-1);pview('${id}')">−</button><b>${q}</b><button class="btn g sm" onclick="chg('${id}',1);pview('${id}')">+</button></div>`:`<button class="btn o" onclick="add('${id}');pview('${id}')">Add to bag</button>`}</div><p class="pdsc">${p.d?esc(p.d):'No description added yet.'}</p><small>Sold by ${esc(p.shop||'jayed.com')}</small><button class="btn g w" style="margin-top:12px" onclick="closeM()">Close</button>`)}

/* ---------- product photo upload (Supabase "products" bucket) ---------- */
async function shrink(f){try{if(!/^image\//.test(f.type))return f;const bm=await createImageBitmap(f),s=Math.min(1,1000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(x){return f}}
async function upImg(f){if(!f)return'';if(!sb)throw new Error('Supabase is not connected');f=await shrink(f);const p=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_'),r=await sb.storage.from('products').upload(p,f,{contentType:f.type||'image/jpeg'});if(r.error)throw r.error;return sb.storage.from('products').getPublicUrl(p).data.publicUrl}
async function addP(){const u=me(),e=m=>$('#er').textContent=m;if(!canShop(u))return e('Only the CEO, admins and managers can list products.');
const n=$('#pn').value.trim(),p=+$('#pp').value,c=$('#pc').value.trim(),f=$('#pf').files[0];
if(!n||!(p>0)||!c)return e('Fill in name, price and category.');
let img=($('#pimgu').value||'').trim();if(img&&!/^https:\/\//.test(img))return e('Photo link must start with https://');
if(f){e('Uploading photo...');try{img=await upImg(f)}catch(x){return e('Photo upload failed: '+(x.message||x)+'. Run the Supabase SQL once, or paste a photo link instead.')}}
products.push({id:'p'+Date.now(),e:$('#pe').value||'🛒',n,p,c,u:$('#pu').value.trim(),d:$('#pdsc').value.trim(),img,shop:$('#psh').value.trim()||'jayed.com',fl:$('#pfl').checked,t:Date.now(),by:u.id});
set('products',products);draw();toast('Product listed');dash()}
async function chgImg(id,inp){const f=inp.files[0];if(!f)return;toast('Uploading photo...');try{const url=await upImg(f);products=products.map(p=>p.id===id?{...p,img:url}:p);set('products',products);draw();toast('Photo saved');dash()}catch(x){toast('Upload failed: '+(x.message||x))}}
function togFl(id){products=products.map(p=>p.id===id?{...p,fl:!p.fl}:p);set('products',products);draw();dash()}
function editP(id){const p=products.find(x=>x.id===id);if(!p)return;openM(`<h3>Edit product</h3><label>Name</label><input id="en" value="${esc(p.n)}"><label>Unit</label><input id="eu" value="${esc(p.u||'')}"><label>Price (৳)</label><input id="ep" type="number" min="1" value="${p.p}"><label>Category</label><input id="ec" list="cl" value="${esc(p.c)}"><label>Shop / vendor</label><input id="es" list="sl" value="${esc(p.shop||'')}"><label>Description</label><textarea id="ed" rows="3">${esc(p.d||'')}</textarea><div id="eer" style="color:#dc2626;font-size:13px"></div><button class="btn w" onclick="saveP('${id}')">Save</button><button class="btn g w" style="margin-top:8px" onclick="closeM()">Cancel</button>`)}
function saveP(id){const n=$('#en').value.trim(),pr=+$('#ep').value,c=$('#ec').value.trim();if(!n||!(pr>0)||!c)return $('#eer').textContent='Fill in name, price and category.';
products=products.map(p=>p.id===id?{...p,n,p:pr,c,u:$('#eu').value.trim(),d:$('#ed').value.trim(),shop:$('#es').value.trim()||'jayed.com'}:p);set('products',products);closeM();draw();dash();toast('Saved')}

/* ---------- staff dashboard ---------- */
function dirty(){return[...document.querySelectorAll('#staff input,#staff textarea')].some(i=>i.type==='file'?(i.files&&i.files.length):i.type==='checkbox'?i.checked!==i.defaultChecked:i.value!==i.defaultValue)}
function sTabs(u){const Q=get('users',[]).filter(x=>x.status==='Pending Verification').length,t=[['ord','Orders']];
if(isTop(u))t.push(['apr','Approvals'+(Q?' ('+Q+')':'')]);if(u.role==='ceo')t.push(['team','Team']);
if(u.role==='manager'||isTop(u)){const W=appWait(u);t.push(['app','Applications'+(W?' ('+W+')':'')])}if(canShop(u))t.push(['prod','Products'],['off','Offers']);if(canSite(u))t.push(['site','Site']);return t}
function dash(){const u=me();if(!u)return show('shop');show('staff');const ok=u.status==='Approved';
let h=`<div class="hero"><span class="pill ${ok?'ok':'w'}">${ROLES[u.role]||u.role}: ${esc(u.status)}</span><h1 style="font-size:34px;margin-top:8px">Hello, ${esc(u.name)}</h1><p class="mut">${esc(u.email)}${u.shop?' / '+esc(u.shop):''}</p><button class="btn g sm" onclick="show('shop')">Back to shop</button> <button class="btn g sm" onclick="out()">Log out</button></div>`;
if(!ok){$('#staff').innerHTML=h+`<div class="card"><b>${u.status==='Rejected'?'Your application was rejected.':u.status==='Suspended'?'Your account is suspended.':'Waiting for approval.'}</b><p class="mut">You cannot work on the platform until you are approved.</p></div>`;return}
const T=sTabs(u);if(!T.some(x=>x[0]===sTab))sTab='ord';
h+=`<div class="nav">${T.map(x=>`<button class="tab${x[0]===sTab?' on':''}" onclick="sTab='${x[0]}';dash()">${x[1]}</button>`).join('')}</div>`;
h+=({ord:tOrd,apr:tApr,team:tTeam,prod:tProd,off:tOff,site:tSite,app:tApp}[sTab])(u);$('#staff').innerHTML=h}
function tOrd(u){let O=get('orders',[]);if(u.role==='rider')O=O.filter(o=>o.st==='Preparing'||o.rider===u.id);if(u.role==='vendor')O=O.filter(o=>!o.shops||o.shops.includes(u.shop));
return`<h3>Orders</h3>`+(O.map(o=>ordCard(o,u)).join('')||'<p class="mut">No orders right now.</p>')+teamUI(u)}
function tApr(u){const Q=get('users',[]).filter(x=>x.status==='Pending Verification');
return`<h3>Approvals</h3>`+(Q.map(x=>{const can=u.role==='ceo'||x.role!=='admin';return`<div class="card cr"><b>${esc(x.name)}</b> <span class="pill">${ROLES[x.role]||esc(x.role)}</span><br><small>${esc(x.email)}, ${esc(x.phone)}${x.shop?', shop: '+esc(x.shop):''}<br>Documents: ${Object.entries(x.docs||{}).map(([k,v])=>esc(k)+': '+esc(v.split('/').pop())).join(', ')||esc(x.doc||'none')}</small><div class="row">${can?`<button class="btn sm" onclick="decide('${x.id}',1)">Approve</button><button class="btn g sm" onclick="decide('${x.id}',0)">Reject</button>`:'<small>Only the CEO can approve admins.</small>'}${sb?Object.entries(x.docs||{}).filter(([k,v])=>v.startsWith('docs/')).map(([k,v])=>`<button class="btn g sm" onclick="viewDoc('${esc(v)}')">View ${esc(k)}</button>`).join(''):''}</div></div>`}).join('')||'<p class="mut">No pending applications.</p>')}
function tTeam(u){const L=get('users',[]).filter(x=>x.id!==u.id&&x.role!=='ceo'),ST=['Approved','Pending Verification','Rejected','Suspended'];
return`<h3>Team and roles</h3><p class="mut">There is only one CEO (you). Riders, managers and admins can be unlimited. An admin can edit the site (menu, pages, settings) only if you tick the permission.</p>`+(L.map(x=>`<div class="card cr"><b>${esc(x.name)}</b> <small>${esc(x.email)} ${esc(x.phone||'')}</small><label>Role</label><select onchange="uSet('${x.id}','role',this.value)">${['vendor','rider','manager','helpcare','admin'].map(r=>`<option value="${r}"${x.role===r?' selected':''}>${ROLES[r]}</option>`).join('')}</select><label>Status</label><select onchange="uSet('${x.id}','status',this.value)">${ST.map(s=>`<option${x.status===s?' selected':''}>${s}</option>`).join('')}</select>${x.role==='admin'?`<label class="ck"><input type="checkbox" ${x.canEdit?'checked':''} onchange="uSet('${x.id}','canEdit',this.checked)">Allow this admin to edit the site</label>`:''}<button class="btn g sm" onclick="uDel('${x.id}')">Remove</button></div>`).join('')||'<p class="mut">No other team members yet.</p>')}
function uSet(id,k,v){const U=get('users',[]),x=U.find(y=>y.id===id);if(!x||x.role==='ceo')return;x[k]=v;set('users',U);toast('Saved')}
function uDel(id){if(!confirm('Remove this person from the team?'))return;set('users',get('users',[]).filter(x=>x.id!==id));dash()}
function tProd(u){const cats=[...new Set([...products.map(p=>p.c),...menuItems().flatMap(m=>m.t==='cat'?[m.r||m.l,...(m.ch||[]).map(c=>c.r||c.l)]:[])])].filter(Boolean),shops=[...new Set(['jayed.com',...get('users',[]).filter(x=>x.role==='vendor'&&x.shop).map(x=>x.shop)])];
return`<datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="sl">${shops.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><h3>Add a product</h3><div class="card cr"><p class="mut">Vendors cannot list products. You list them here, with the vendor's shop name.</p><label>Photo</label><label class="btn g w" style="display:block;margin:4px 0 6px">Choose photo<input id="pf" type="file" accept="image/*" hidden onchange="$('#pfn').textContent=this.files[0]?this.files[0].name:''"></label><small id="pfn"></small><label>Or paste a photo link (optional)</label><input id="pimgu" placeholder="https://..."><label>Emoji (shown when there is no photo)</label><input id="pe" value="🛒" maxlength="4"><label>Name</label><input id="pn"><label>Unit (e.g. 1 kg, 12 pcs)</label><input id="pu"><label>Price (৳)</label><input id="pp" type="number" min="1"><label>Description</label><textarea id="pdsc" rows="3"></textarea><label>Category (pick or type a new one)</label><input id="pc" list="cl"><label>Shop / vendor</label><input id="psh" list="sl" value="jayed.com"><label class="ck"><input type="checkbox" id="pfl">Show in Flash Sales</label><button class="btn w" onclick="addP()">List product</button><div id="er"></div></div><h3>All products (${products.length})</h3>`+products.map(p=>`<div class="card cr"><span>${esc(p.e||'')} <b>${esc(p.n)}</b><br><small>৳${p.p} · ${esc(p.c)} · ${esc(p.shop||'')}${p.img?' · photo ✓':''}${p.fl?' · flash':''}</small></span><div class="row"><button class="btn g sm" onclick="editP('${p.id}')">Edit</button><label class="btn g sm" style="margin:0">Photo<input type="file" accept="image/*" hidden onchange="chgImg('${p.id}',this)"></label><button class="btn g sm" onclick="togFl('${p.id}')">${p.fl?'Unflash':'Flash'}</button><button class="btn g sm" onclick="delP('${p.id}')">Delete</button></div></div>`).join('')}
function tOff(u){return`<h3>Create an offer package</h3><div class="card cr"><label>Package name</label><input id="on"><label>Emoji</label><input id="oe" value="🎁" maxlength="4"><label>Package price (৳)</label><input id="op" type="number" min="1"><label>Pick the products to include</label>${products.map(p=>`<label class="ck"><input type="checkbox" class="of" value="${p.id}">${esc(p.e||'')} ${esc(p.n)} ৳${p.p}</label>`).join('')}<button class="btn o w" onclick="addO()">Publish offer</button></div><h3>All offers</h3>`+(offers.map(o=>`<div class="card cr row" style="margin-top:0"><span>${esc(o.e)} ${esc(o.n)} <small>৳${o.p}</small></span><button class="btn g sm" onclick="delO('${o.id}')">Delete</button></div>`).join('')||'<p class="mut">No offers yet.</p>')}

/* ---------- Site editor: menu, help pages, settings (no code needed) ---------- */
function loadED(){if(!ED)ED={menu:clone(menuItems()),pages:clone(pagesList()),set:{...SET()},job:clone(jobCfg())}}
function tSite(u){loadED();const t=(k,l)=>`<button class="chip${edTab===k?' on':''}" onclick="edTab='${k}';dash()">${l}</button>`;
return`<h3>Site editor</h3><p class="mut">Change the menu, help pages and settings here. Nothing changes on the live site until you press Save.</p><div class="tabs">${t('menu','Menu')}${t('pages','Help pages')}${t('job','Job corner')}${t('set','Settings')}</div>`+({menu:edMenu,pages:edPages,set:edSet,job:edJob}[edTab])()}
const MT=[['cat','Category (shows products)'],['page','Help page'],['view','App screen'],['flash','Flash sales'],['new','New arrivals'],['link','Web link'],['staff','Staff login'],['group','Group (only opens its sub-list)'],['head','Heading'],['space','Blank gap']];
const MV=[['shop','Home'],['vo','Offers'],['vd','Coupons'],['vf','Favourites'],['vp','My profile and orders'],['vj','Job corner']];
function mCtl(i,j){return`<span><button class="btn g sm" onclick="mMv(${i},${j},-1)">↑</button> <button class="btn g sm" onclick="mMv(${i},${j},1)">↓</button> <button class="btn g sm" onclick="mDl(${i},${j})">✕</button></span>`}
function refEd(it,i,j){const t=it.t;
if(t==='view')return`<label>Screen</label><select onchange="mSet(${i},${j},'r',this.value)">${MV.map(v=>`<option value="${v[0]}"${(it.r||'shop')===v[0]?' selected':''}>${v[1]}</option>`).join('')}</select>`;
if(t==='page')return`<label>Page</label><select onchange="mSet(${i},${j},'r',this.value)">${ED.pages.map(p=>`<option value="${esc(p.id)}"${it.r===p.id?' selected':''}>${esc(p.t)}</option>`).join('')}</select>`;
if(t==='cat')return`<label>Product category name (empty = same as the name above)</label><input value="${esc(it.r||'')}" oninput="mSet(${i},${j},'r',this.value)">`;
if(t==='link')return`<label>Link (https://...)</label><input value="${esc(it.r||'')}" oninput="mSet(${i},${j},'r',this.value)">`;return''}
function itemEd(it,i,j){const sub=j>=0,t=it.t,opts=MT.filter(x=>!sub||!['group','head','space'].includes(x[0]));
let h=`<div class="card cr${sub?' subc':''}"><div class="row" style="margin:0"><b>${sub?'Sub-item '+(j+1):'Item '+(i+1)}</b>${mCtl(i,j)}</div><label>Type</label><select onchange="mSet(${i},${j},'t',this.value)">${opts.map(x=>`<option value="${x[0]}"${t===x[0]?' selected':''}>${x[1]}</option>`).join('')}</select>`;
if(t!=='space')h+=`<label>Name</label><input value="${esc(it.l||'')}" oninput="mSet(${i},${j},'l',this.value)">`;
if(!sub&&t!=='space'&&t!=='head')h+=`<label>Icon (emoji, optional)</label><input value="${esc(it.ic||'')}" maxlength="4" oninput="mSet(${i},${j},'ic',this.value)">`;
h+=refEd(it,i,j);
if(!sub&&t!=='space'&&t!=='head')h+=(it.ch||[]).map((c,k)=>itemEd(c,i,k)).join('')+`<button class="btn g sm" onclick="mAd(${i})">+ Add sub-item</button>`;
return h+'</div>'}
function edMenu(){return`<div class="row"><button class="btn sm" onclick="mSv()">Save menu</button><button class="btn g sm" onclick="ED=null;dash()">Reload</button><button class="btn g sm" onclick="mRst()">Reset</button></div><div style="height:12px"></div>`+ED.menu.map((it,i)=>itemEd(it,i,-1)).join('')+`<button class="btn o w" onclick="mAd(-1)">+ Add menu item</button>`}
function mSet(i,j,k,v){const it=j>=0?ED.menu[i].ch[j]:ED.menu[i];it[k]=v;if(k==='t'){it.r=v==='view'?'shop':v==='page'?((ED.pages[0]||{}).id||''):'';dash()}}
function mMv(i,j,d){const a=j>=0?ED.menu[i].ch:ED.menu,x=j>=0?j:i,k=x+d;if(k<0||k>=a.length)return;[a[x],a[k]]=[a[k],a[x]];dash()}
function mDl(i,j){if(!confirm('Remove this item?'))return;if(j>=0)ED.menu[i].ch.splice(j,1);else ED.menu.splice(i,1);dash()}
function mAd(i){const n={id:'m'+Date.now()+Math.floor(Math.random()*99),l:'New item',t:'cat',r:'',ic:''};if(i>=0){ED.menu[i].ch=ED.menu[i].ch||[];ED.menu[i].ch.push(n)}else ED.menu.push({...n,ch:[]});dash()}
function mSv(){saveSite('menu',{items:clone(ED.menu),v:2});toast('Menu saved')}
function mRst(){if(confirm('Reset the menu to the default list?')){ED.menu=clone(DEF_MENU);dash()}}
function edPages(){return`<p class="mut">Write plain text. A blank line starts a new paragraph. Use **bold**, lines starting with - for bullets, # for a heading, and [text](https://link) for links.</p><div class="row"><button class="btn sm" onclick="pSv()">Save pages</button><button class="btn g sm" onclick="ED=null;dash()">Reload</button><button class="btn g sm" onclick="pRst()">Reset</button></div><div style="height:12px"></div>`+ED.pages.map((x,i)=>`<div class="card cr"><label>Title</label><input value="${esc(x.t)}" oninput="ED.pages[${i}].t=this.value"><label class="ck"><input type="checkbox" ${x.tab!==false?'checked':''} onchange="ED.pages[${i}].tab=this.checked">Show as a tab on the Help page</label><label>Text</label><textarea rows="8" oninput="ED.pages[${i}].h=this.value">${esc(x.h||'')}</textarea><div class="row"><span><button class="btn g sm" onclick="pMv(${i},-1)">↑</button> <button class="btn g sm" onclick="pMv(${i},1)">↓</button></span><button class="btn g sm" onclick="pDl(${i})">Delete</button></div></div>`).join('')+`<button class="btn o w" onclick="pAd()">+ Add page</button>`}
function pMv(i,d){const k=i+d,a=ED.pages;if(k<0||k>=a.length)return;[a[i],a[k]]=[a[k],a[i]];dash()}
function pDl(i){if(confirm('Delete this page?')){ED.pages.splice(i,1);dash()}}
function pAd(){ED.pages.push({id:'pg'+Date.now(),t:'New page',h:'',tab:true});dash()}
function pSv(){saveSite('pages',{items:clone(ED.pages)});toast('Pages saved')}
function pRst(){if(confirm('Reset all pages to the default text?')){ED.pages=clone(DEF_PAGES);dash()}}
const SF=[['clubName','Club name (top of menu)'],['clubPts','Club points text'],['clubBtn','Club button text'],['wa','WhatsApp number (880..., digits only)'],['fb','Facebook link'],['yt','YouTube link'],['banner','Help page banner picture link (https, optional)'],['delT','Delivery charge threshold (৳)'],['delLo','Delivery charge below threshold (৳)'],['delHi','Delivery charge at or above threshold (৳)'],['bk','bKash number (to receive payments)'],['ba','Bank account number'],['bn','Bank name (optional)']];
function edSet(){return`<div class="card cr">${SF.map(f=>`<label>${f[1]}</label><input value="${esc(ED.set[f[0]]==null?'':ED.set[f[0]])}" oninput="ED.set['${f[0]}']=this.value">`).join('')}<label>Delivery OTP</label><select onchange="ED.set.otp=this.value==='1'"><option value="0"${ED.set.otp?'':' selected'}>Off</option><option value="1"${ED.set.otp?' selected':''}>On (customer gives a 4-digit code to the rider)</option></select><button class="btn w" onclick="sSave()">Save settings</button></div>`}
function sSave(){const s={...ED.set};['delT','delLo','delHi'].forEach(k=>s[k]=Math.max(0,+s[k]||0));s.wa=String(s.wa||'').replace(/\D/g,'')||DEF_SET.wa;
['fb','yt'].forEach(k=>{s[k]=String(s[k]||'').trim();if(!/^https:\/\//.test(s[k]))s[k]=DEF_SET[k]});s.banner=/^https:\/\//.test(String(s.banner||'').trim())?String(s.banner).trim():'';
['clubName','clubPts','clubBtn'].forEach(k=>s[k]=String(s[k]||'').trim()||DEF_SET[k]);s.otp=!!s.otp;['bk','ba'].forEach(k=>s[k]=String(s[k]||'').trim()||DEF_SET[k]);s.bn=String(s.bn||'').trim();ED.set=s;saveSite('main',s);toast('Settings saved');dash()}
renderMenu();draw();cartUI();acctUI();
</script>
<script>
// ---- Step 1: Job corner (criteria, areas, apply form, manager then admin approval) ----
const DEF_CRIT=`**Who can apply**
- Age 18 or older.
- Valid NID or birth certificate.
- Working phone number.

**Conditions**
- All information and documents must be true. False information cancels the application.
- Applying does not guarantee a job.
- Your application first goes to the manager of the area you choose, then to the admin for final approval.
- Selected people must follow company rules and local laws.`;
const DEFJOB={open:true,ver:1,crit:DEF_CRIT,areas:[]};
const jobCfg=()=>({...DEFJOB,...(siteDoc('jobcfg')||{})});
const JST={'Pending Manager':['With area manager','w'],'Pending Admin':['With admin','w'],'Approved':['Approved','ok'],'Rejected':['Rejected','']};
const jPill=x=>{const j=JST[x]||[x,''];return`<span class="pill ${j[1]}">${esc(j[0])}</span>`};
const myUid=()=>(window.fbUid&&fbUid())||'';
function jFormDirty(){const f=$('#jf');return!!f&&[...f.querySelectorAll('input,textarea,select')].some(i=>i.type==='file'?(i.files&&i.files.length):i.type==='checkbox'?i.checked!==i.defaultChecked:i.tagName==='SELECT'?i.selectedIndex>0:i.value!==i.defaultValue)}
function jMy(){const L=get('applications',[]).filter(a=>a.uid===myUid()).sort((x,y)=>(y.t||0)-(x.t||0));
return`<h3 style="margin-top:24px">My applications</h3>`+(L.map(a=>`<div class="card cr"><div class="row" style="margin:0"><b>${esc(a.areaName||'')}</b>${jPill(a.st)}</div><small>${new Date(a.t).toLocaleDateString()}</small>${a.mnote?`<p style="margin:6px 0 0"><small>Manager: ${esc(a.mnote)}</small></p>`:''}${a.anote?`<p style="margin:6px 0 0"><small>Admin: ${esc(a.anote)}</small></p>`:''}</div>`).join('')||'<p class="mut">You have not applied yet.</p>')}
function dJob(force){const C=jobCfg(),c=cust(),ar=C.areas||[];
if(!force&&jFormDirty()&&$('#jmy')){$('#jmy').innerHTML=jMy();return}
let h=`<div class="hhero"><h2>Job corner</h2></div><div class="card cr" style="margin-top:16px"><h3>Criteria and conditions</h3><small>Version ${+C.ver||1}</small><div class="pgt" style="margin-top:8px">${fmt(C.crit)}</div></div>`;
if(!C.open)h+=`<div class="card cr"><b>Applications are closed right now.</b><p class="mut">Please check again later.</p></div>`;
else if(!ar.length)h+=`<div class="card cr"><b>No job areas are open yet.</b><p class="mut">Please check again later.</p></div>`;
else h+=`<div class="card cr" id="jf"><h3>Apply now</h3><label>Your name</label><input id="jn" value="${esc(c?c.name:'')}" autocomplete="name"><label>Phone number</label><input id="jp" type="tel" inputmode="tel" value="${esc(c?c.phone:'')}" placeholder="01XXXXXXXXX"><label>Email (optional)</label><input id="je" type="email" value="${esc((c&&c.email)||'')}"><label>Area you want to work in</label><select id="ja"><option value="">Select area</option>${ar.map(a=>`<option value="${esc(a.id)}">${esc(a.n)}</option>`).join('')}</select><label>Documents (CV, PDF, photo)</label><small>Up to 5 files, 5 MB each</small><label class="btn g w" style="display:block;margin:6px 0"><span>Choose files</span><input id="jfl" type="file" multiple accept=".pdf,.doc,.docx,image/*" hidden onchange="jFiles()"></label><small id="jfn"></small><label style="display:block;margin-top:8px">Anything else you want to tell us</label><textarea id="jt" rows="4" maxlength="1500" placeholder="Experience, skills, availability, questions..."></textarea><label class="ck"><input type="checkbox" id="jc"> I have read and accept the criteria and conditions above.</label><div id="jer" style="color:#dc2626;font-size:13px;min-height:18px"></div><button class="btn o w" id="jb" onclick="jobApply()">Submit application</button></div>`;
$('#vj').innerHTML=h+`<div id="jmy">${jMy()}</div><div style="height:30px"></div>`}
function jFiles(){const i=$('#jfl'),F=[...i.files];if(F.length>5||F.some(f=>f.size>5*1024*1024)){i.value='';$('#jfn').textContent='';return toast('Maximum 5 files, 5 MB each')}
$('#jfn').textContent=F.map(f=>f.name).join(', ')}
async function jobApply(){const C=jobCfg(),e=m=>$('#jer').textContent=m,name=$('#jn').value.trim(),phone=ph($('#jp').value),em=$('#je').value.trim().toLowerCase(),ar=(C.areas||[]).find(x=>x.id===$('#ja').value),F=[...$('#jfl').files];
if(!C.open)return e('Applications are closed right now.');
if(name.length<2)return e('Enter your name.');if(!phone)return e('Enter a valid phone number, like 01712345678.');
if(em&&!/^\S+@\S+\.\S+$/.test(em))return e('Enter a valid email or leave it empty.');
if(!ar)return e('Select the area you want to work in.');
if(!$('#jc').checked)return e('You must accept the criteria and conditions to apply.');
if(!myUid())return e('Connecting. Please try again in a moment.');
const b=$('#jb');b.disabled=true;e('Uploading documents...');const docs=[];
try{for(const f of F)docs.push({n:f.name.slice(0,60),p:await up(f,'docs')})}catch(x){b.disabled=false;return e('Upload failed. Try again with smaller files.')}
const a={id:'AP'+Date.now().toString(36)+Math.floor(100+Math.random()*900),uid:myUid(),name,phone,email:em,area:ar.id,areaName:ar.n,mgr:ar.mg||'',note:$('#jt').value.trim(),docs,ver:+C.ver||1,st:ar.mg?'Pending Manager':'Pending Admin',t:Date.now()};
const L=get('applications',[]);L.unshift(a);set('applications',L);toast('Application submitted');dJob(true)}
function jobDoc(id,i){const a=get('applications',[]).find(x=>x.id===id),d=a&&(a.docs||[])[i];if(!d)return;if(!/^docs\//.test(d.p)||!sb)return toast('This file is not stored online');viewDoc(d.p)}
const appWait=u=>get('applications',[]).filter(a=>(u.role==='manager'&&a.mgr===u.id&&a.st==='Pending Manager')||(isTop(u)&&a.st==='Pending Admin')).length;
function appCard(a,u){const my=u.role==='manager'&&a.mgr===u.id&&a.st==='Pending Manager',ad=isTop(u)&&a.st==='Pending Admin',D=a.docs||[];
return`<div class="card cr"><div class="row" style="margin:0"><b>${esc(a.name)}</b>${jPill(a.st)}</div><small>${esc(a.areaName||'')} / ${new Date(a.t).toLocaleDateString()} / criteria v${+a.ver||1}</small><br><small>${esc(a.phone)}${a.email?' / '+esc(a.email):''}</small>${a.note?`<p style="white-space:pre-line;margin:8px 0">${esc(a.note)}</p>`:''}${D.length?`<div style="margin:6px 0">${D.map((d,i)=>`<button class="btn g sm" style="margin:2px 4px 2px 0" onclick="jobDoc('${esc(a.id)}',${i})">${esc(d.n)}</button>`).join('')}</div>`:'<p class="mut" style="margin:6px 0">No documents attached.</p>'}${a.mnote?`<small>Manager${a.mby?' ('+esc(a.mby)+')':''}: ${esc(a.mnote)}</small><br>`:''}${a.anote?`<small>Admin${a.aby?' ('+esc(a.aby)+')':''}: ${esc(a.anote)}</small><br>`:''}${my||ad?`<input id="nt${esc(a.id)}" placeholder="Remark (optional)" maxlength="300"><div class="row"><button class="btn sm" onclick="appAct('${esc(a.id)}',1)">${my?'Approve and send to admin':'Approve'}</button><button class="btn g sm" onclick="appAct('${esc(a.id)}',0)">Reject</button></div>`:''}<a class="btn g sm" href="tel:${esc(a.phone)}">Call</a></div>`}
function tApp(u){const L=get('applications',[]).slice().sort((x,y)=>(y.t||0)-(x.t||0)),w=L.filter(a=>(u.role==='manager'&&a.mgr===u.id&&a.st==='Pending Manager')||(isTop(u)&&a.st==='Pending Admin')),o=L.filter(a=>!w.includes(a));
return`<h3>Job applications</h3><p class="mut">${u.role==='manager'?'Applications for your area. Approve to send them to the admin.':'Applications approved by area managers wait here for your final decision.'}</p><h3 style="font-size:16px">Waiting for you (${w.length})</h3>`+(w.map(a=>appCard(a,u)).join('')||'<p class="mut">Nothing waiting.</p>')+`<h3 style="font-size:16px;margin-top:20px">Others (${o.length})</h3>`+(o.map(a=>appCard(a,u)).join('')||'<p class="mut">No other applications.</p>')}
function appAct(id,ok){const u=me(),L=get('applications',[]),a=L.find(x=>x.id===id);if(!u||!a||u.status!=='Approved')return;
const n=(($('#nt'+id)||{}).value||'').trim(),now=Date.now();
if(u.role==='manager'&&a.mgr===u.id&&a.st==='Pending Manager'){a.mby=u.name;a.mt=now;a.mnote=n;a.st=ok?'Pending Admin':'Rejected'}
else if(isTop(u)&&a.st==='Pending Admin'){a.aby=u.name;a.at=now;a.anote=n;a.st=ok?'Approved':'Rejected'}
else return toast('Not allowed');
set('applications',L);toast(ok?'Approved':'Rejected');dash()}
function edJob(){const J=ED.job,M=get('users',[]).filter(x=>x.role==='manager'&&x.status==='Approved');
return`<p class="mut">Criteria and areas are set here. The CEO can always edit. An admin can edit only after the CEO gives the "edit site" permission in the Team tab. When the criteria text changes, the version number goes up and new applicants accept the new version.</p><div class="row"><button class="btn sm" onclick="jSv()">Save job corner</button><button class="btn g sm" onclick="ED=null;dash()">Reload</button></div><div style="height:12px"></div><div class="card cr"><label>Applications</label><select onchange="ED.job.open=this.value==='1'"><option value="1"${J.open?' selected':''}>Open</option><option value="0"${J.open?'':' selected'}>Closed</option></select><label>Criteria and conditions (now version ${+J.ver||1})</label><textarea rows="10" oninput="ED.job.crit=this.value">${esc(J.crit||'')}</textarea></div><h3>Areas</h3>`+(J.areas||[]).map((a,i)=>`<div class="card cr"><div class="row" style="margin:0"><b>Area ${i+1}</b><button class="btn g sm" onclick="jAr(${i})">✕</button></div><label>Area name</label><input value="${esc(a.n||'')}" oninput="ED.job.areas[${i}].n=this.value"><label>Area manager</label><select onchange="ED.job.areas[${i}].mg=this.value"><option value="">No manager (goes straight to admin)</option>${M.map(m=>`<option value="${esc(m.id)}"${a.mg===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`).join('')+`<button class="btn o w" onclick="jAr(-1)">+ Add area</button>`}
function jAr(i){if(i>=0){if(!confirm('Remove this area?'))return;ED.job.areas.splice(i,1)}else ED.job.areas.push({id:'ar'+Date.now().toString(36)+Math.floor(Math.random()*99),n:'',mg:'',mn:''});dash()}
function jSv(){const u=me();if(!canSite(u))return toast('Not allowed');const J=ED.job,old=jobCfg(),M=get('users',[]);
const areas=(J.areas||[]).map(a=>({id:a.id,n:String(a.n||'').trim(),mg:a.mg||'',mn:(M.find(x=>x.id===a.mg)||{}).name||''}));
if(areas.some(a=>!a.n))return toast('Every area needs a name.');
if(new Set(areas.map(a=>a.n.toLowerCase())).size!==areas.length)return toast('Area names must be different.');
const crit=String(J.crit||'').trim()||DEF_CRIT;
saveSite('jobcfg',{open:!!J.open,areas,crit,ver:crit===old.crit?(+old.ver||1):(+old.ver||1)+1});ED=null;toast('Job corner saved');dash()}
</script>
<script>
// ---- Step 2: profiles, password recovery, dashboards, charts, accounts, downloads ----
const tk=n=>'৳'+Math.round(+n||0).toLocaleString('en-US');
const sum=a=>a.reduce((s,x)=>s+(+x||0),0);
const rid=p=>p+Date.now().toString(36)+Math.floor(100+Math.random()*900);
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const fdate=t=>t?new Date(t).toLocaleDateString('en-GB'):'';
const areasList=()=>jobCfg().areas||[];
const areaName=id=>(areasList().find(a=>a.id===id)||{}).n||'';
const profOf=id=>get('profiles',[]).find(p=>p.id===id)||null;
const okImg=s=>/^data:image\/(jpeg|png|webp);base64,/.test(s||'');
const avatar=(pt,n)=>okImg(pt)?`<img src="${pt}" alt="">`:esc((n||'?').trim().charAt(0).toUpperCase());
const nextEid=U=>Math.max(1000000,...U.map(x=>+x.eid||0))+1;
let per='30',arF='',oq='',os='All',olim=30,pfPhoto=null,payM='cod';
const PERIODS=[['7','Last 7 days'],['30','Last 30 days'],['all','All time']];
const inP=t=>per==='all'||(Date.now()-(t||0))<=(+per)*864e5;
const PAL=['#6f4e37','#c08a5b','#15803d','#2563eb','#d97706','#dc2626','#7c3aed'];
const SC={Pending:'#d97706',Preparing:'#2563eb','Out for Delivery':'#7c3aed',Delivered:'#15803d',Cancelled:'#dc2626'};

/* ---------- downloads ---------- */
function csvDl(name,rows){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function printDoc(title,body){const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);const d=f.contentWindow.document;d.open();d.write(`<!doctype html><meta charset="utf-8"><title>${esc(title)}</title><style>body{font:14px/1.5 system-ui,sans-serif;color:#17110d;padding:24px}h1{font-size:22px;margin:0 0 4px}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{border:1px solid #ccc;padding:6px 8px;text-align:left;font-size:13px}th{background:#f6efe6}.k{color:#6b5a4b}.n{text-align:right}img{width:110px;height:110px;object-fit:cover;border-radius:12px}</style>${body}`);d.close();setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){}setTimeout(()=>f.remove(),60000)},500)}

/* ---------- charts (plain SVG / HTML, no library) ---------- */
function hBars(a){const m=Math.max(1,...a.map(x=>Math.abs(x.v)));return a.length?a.map(x=>`<div style="margin:9px 0"><div class="row" style="margin:0 0 3px"><small>${esc(x.l)}</small><b style="font-size:13px;color:${x.v<0?'#dc2626':'inherit'}">${x.f||tk(x.v)}</b></div><div style="height:12px;background:var(--soft);border-radius:99px;overflow:hidden"><div style="width:${Math.max(2,Math.abs(x.v)/m*100)}%;height:100%;border-radius:99px;background:${x.v<0?'#dc2626':(x.c||'#6f4e37')}"></div></div></div>`).join(''):'<p class="mut">No data yet.</p>'}
function vBars(L,V){const W=320,H=140,p=24,m=Math.max(1,...V),bw=(W-p*2)/L.length;let s=`<svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto"><text x="2" y="10" font-size="9" fill="#6b5a4b">${tk(m)}</text>`;
[0,.5,1].forEach(g=>{const y=H-g*(H-18);s+=`<line x1="${p}" x2="${W-p}" y1="${y}" y2="${y}" stroke="#e8dccb"/>`});
V.forEach((v,i)=>{const h=v/m*(H-18);s+=`<rect x="${p+i*bw+bw*.18}" y="${H-h}" width="${bw*.64}" height="${h}" rx="4" fill="#6f4e37"/>`});
L.forEach((l,i)=>{s+=`<text x="${p+i*bw+bw/2}" y="${H+14}" font-size="9" text-anchor="middle" fill="#6b5a4b">${esc(l)}</text>`});return s+'</svg>'}
function lineChart(L,S){const W=320,H=140,p=26,n=L.length,m=Math.max(1,...S.flatMap(s=>s.v)),x=i=>p+(n<2?0:i*(W-p*2)/(n-1)),y=v=>H-v/m*(H-18);
let s=`<svg viewBox="0 0 ${W} ${H+22}" style="width:100%;height:auto"><text x="2" y="10" font-size="9" fill="#6b5a4b">${tk(m)}</text>`;
[0,.5,1].forEach(g=>{const yy=H-g*(H-18);s+=`<line x1="${p}" x2="${W-p}" y1="${yy}" y2="${yy}" stroke="#e8dccb"/>`});
S.forEach(q=>{s+=`<polyline fill="none" stroke="${q.c}" stroke-width="2.2" stroke-linejoin="round" points="${q.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`});
L.forEach((l,i)=>{if(i%Math.ceil(n/6)===0)s+=`<text x="${x(i)}" y="${H+14}" font-size="9" text-anchor="middle" fill="#6b5a4b">${esc(l)}</text>`});
return s+`</svg><div style="display:flex;gap:12px;flex-wrap:wrap">${S.map(q=>`<small><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${q.c};margin-right:5px"></span>${esc(q.n)}</small>`).join('')}</div>`}
function donut(a){a=a.filter(x=>x.v>0);const T=sum(a.map(x=>x.v));if(!T)return'<p class="mut">No data yet.</p>';let o=0;const R=42,C=2*Math.PI*R;let s=`<svg viewBox="0 0 120 120" style="width:130px;height:130px;flex:none"><g transform="rotate(-90 60 60)">`;
a.forEach((x,i)=>{const l=x.v/T*C;s+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${x.c||PAL[i%PAL.length]}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-o}"/>`;o+=l});
s+=`</g><text x="60" y="65" text-anchor="middle" font-size="17" font-weight="800" fill="#17110d">${T}</text></svg>`;
return`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">${s}<div>${a.map((x,i)=>`<div style="font-size:13px;margin:2px 0"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${x.c||PAL[i%PAL.length]};margin-right:6px"></span>${esc(x.l)}: <b>${x.f||x.v}</b></div>`).join('')}</div></div>`}
function days(n){return[...Array(n)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(n-1-i));return{k:dayKey(d.getTime()),l:d.getDate()+'/'+(d.getMonth()+1)}})}
function byDay(D,items,val){const m={};items.forEach(x=>{const k=dayKey(x.t);m[k]=(m[k]||0)+val(x)});return D.map(d=>m[d.k]||0)}
const kpi=(l,v,c)=>`<div class="kp ${c||''}"><small>${l}</small><b>${v}</b></div>`;
const card2=(t,b)=>`<div class="card cr"><h3 style="font-size:17px">${t}</h3>${b}</div>`;

/* ---------- scope + money maths ---------- */
const myAreaIds=u=>areasList().filter(a=>a.mg===u.id).map(a=>a.id);
function areaOpts(u){return u.role==='manager'?areasList().filter(a=>a.mg===u.id):areasList()}
function scopeIds(u){if(u.role==='manager'){const A=myAreaIds(u);return arF&&A.includes(arF)?[arF]:A}if(isTop(u))return arF?[arF]:null;return null}
function scopeO(u,pp=true){let O=get('orders',[]),s=scopeIds(u);if(s)O=O.filter(o=>s.includes(o.area));return pp?O.filter(o=>inP(o.t)):O}
function scopeL(u,pp=true){let L=get('ledger',[]),s=scopeIds(u);if(s)L=L.filter(l=>s.includes(l.area));return pp?L.filter(l=>inP(l.t)):L}
function fin(O,L){const D=O.filter(o=>o.st==='Delivered'),rev=sum(D.map(o=>o.total)),ex=sum(L.filter(l=>l.k==='expense').map(l=>l.amt)),sp=sum(L.filter(l=>l.k==='supplier'&&l.st==='Paid').map(l=>l.amt));
return{cnt:O.length,del:D.length,can:O.filter(o=>o.st==='Cancelled').length,pend:O.filter(o=>['Pending','Preparing','Out for Delivery'].includes(o.st)).length,rev,ex,sp,profit:rev-ex-sp}}
function plRows(){const O=get('orders',[]).filter(o=>inP(o.t)),L=get('ledger',[]).filter(l=>inP(l.t)),R=areasList().map(a=>({id:a.id,n:a.n}));R.push({id:'',n:'No area / HQ'});
R.forEach(r=>Object.assign(r,fin(O.filter(o=>(o.area||'')===r.id),L.filter(l=>(l.area||'')===r.id))));return R.filter(r=>r.id||r.cnt||r.ex||r.sp)}
function codRows(){const O=get('orders',[]),L=get('ledger',[]),R=areasList().map(a=>({id:a.id,n:a.n,mg:a.mg,mn:a.mn}));R.push({id:'',n:'No area / HQ',mg:'',mn:''});
R.forEach(r=>{const D=O.filter(o=>(o.area||'')===r.id&&o.st==='Delivered'&&(!o.pay||o.pay.m==='cod')),M=L.filter(l=>l.k==='remit'&&(l.area||'')===r.id);
r.cnt=D.length;r.col=sum(D.map(o=>o.total));r.ok=sum(M.filter(l=>l.st==='Confirmed').map(l=>l.amt));r.pen=sum(M.filter(l=>l.st==='Pending').map(l=>l.amt));r.due=r.col-r.ok});return R}
function txns(){const T=[];get('ledger',[]).forEach(l=>{
if(l.k==='remit'&&l.st==='Confirmed')T.push({t:l.ct||l.t,d:'COD received from '+(l.mname||'manager')+' ('+(l.areaName||'area')+')',acc:l.acc,a:+l.amt});
if(l.k==='expense')T.push({t:l.t,d:'Expense: '+l.cat+(l.note?' - '+l.note:''),acc:l.acc,a:-l.amt});
if(l.k==='supplier'&&l.st==='Paid')T.push({t:l.pt||l.t,d:'Supplier: '+l.who+(l.note?' - '+l.note:''),acc:l.acc,a:-l.amt});
if(l.k==='adj')T.push({t:l.t,d:'Adjustment: '+(l.note||''),acc:l.acc,a:+l.amt})});
get('orders',[]).forEach(o=>{if(o.pay&&o.pay.m!=='cod'&&o.pay.st==='Verified')T.push({t:o.pay.vt||o.t,d:'Online payment #'+o.id+' ('+o.pay.m+')',acc:o.pay.m==='bank'?'bank':'bkash',a:+o.total})});return T.sort((x,y)=>y.t-x.t)}
function balances(){const b={cash:0,bkash:0,bank:0};txns().forEach(x=>{if(b[x.acc]!=null)b[x.acc]+=x.a});return b}
const ACC={cash:'Cash in hand',bkash:'bKash',bank:'Bank'};
const pendingApprovals=()=>get('users',[]).filter(x=>x.status==='Pending Verification').length+get('recovery',[]).filter(r=>r.st==='Pending').length;
const payWait=()=>get('orders',[]).filter(o=>o.pay&&o.pay.m!=='cod'&&o.pay.st==='Unverified').length;

/* ---------- checkout: area + payment method ---------- */
function coModal(){const t=cartUI(),A=areasList(),c=cust();$('#dr').classList.remove('on');payM='cod';
openM(`<h3>Delivery details</h3><p class="mut">${esc(c.name)}, ${esc(c.phone)}</p>${A.length?`<label>Delivery area</label><select id="car"><option value="">Select area</option>${A.map(a=>`<option value="${esc(a.id)}"${c.area===a.id?' selected':''}>${esc(a.n)}</option>`).join('')}</select>`:''}<label>Delivery address</label><textarea id="ad" rows="3" placeholder="House, road, area">${esc(c.addr||'')}</textarea><label>Payment</label><div class="tabs"><button class="chip on" id="pm-cod" onclick="pmSel('cod')">Cash</button><button class="chip" id="pm-bkash" onclick="pmSel('bkash')">bKash</button><button class="chip" id="pm-bank" onclick="pmSel('bank')">Bank</button></div><div id="pmi"></div><div class="row"><span>Total</span><b>৳${t}</b></div><div id="er"></div><button class="btn o w pulse" style="margin-top:12px" onclick="place()">Place order</button>`);pmSel('cod')}
function pmSel(m){payM=m;['cod','bkash','bank'].forEach(k=>$('#pm-'+k).classList.toggle('on',k===m));const S=SET();
$('#pmi').innerHTML=m==='cod'?'<p class="mut">Pay cash to the rider when your order arrives.</p>':`<p class="mut">${m==='bkash'?'Send money by bKash to <b>'+esc(S.bk)+'</b>':'Transfer to bank account <b>'+esc(S.ba)+'</b>'+(S.bn?' ('+esc(S.bn)+')':'')}. Then type the transaction ID below. We check it before delivery.</p><input id="trx" placeholder="Transaction ID" maxlength="30">`}
function place(){const a=$('#ad').value.trim(),A=areasList(),ar=A.find(x=>x.id===($('#car')?$('#car').value:'')),e=m=>$('#er').textContent=m;

function saveCust(){const c=cust(),n=$('#cp_n').value.trim(),em=$('#cp_e').value.trim().toLowerCase();if(n.length<2)return $('#cp_er').textContent='Enter your name.';if(em&&!/^\S+@\S+\.\S+$/.test(em))return $('#cp_er').textContent='Enter a valid email.';

/* ---------- Dashboard shell ---------- */
const TABN={ov:'Overview',ord:'Orders',cod:'COD',pay:'Online payment',acc:'Bank and cash',exp:'Supplier and expenses',pl:'Profit and loss',staff:'Staff and permission',apr:'Approvals',app:'Applications',prod:'Products',off:'Offers',site:'Site',me:'My profile'};
function sTabs(u){const R=u.role;let k=[];if(R==='ceo'||R==='admin')k=['ov','ord','cod','pay','acc','exp','pl','staff','apr','app'];else if(R==='manager')k=['ov','ord','cod','staff','app'];else if(R==='helpcare')k=['ov','ord'];else k=['ord'];

const cnt={apr:isTop(u)?pendingApprovals():0,app:(R==='manager'||isTop(u))?appWait(u):0,pay:isTop(u)?payWait():0};return k.map(x=>[x,TABN[x]+(cnt[x]?' ('+cnt[x]+')':'')])}
function dash(){const u=me();if(!u)return show('shop');show('staff');const ok=u.status==='Approved';if(ok&&isTop(u))ensureIds();
const P=profOf(u.id)||{},ar=u.role==='manager'?myAreaIds(u).map(areaName).join(', '):areaName(u.area);

if(!ok){$('#staff').innerHTML=h+`<div class="card"><b>${u.status==='Rejected'?'Your application was rejected.':u.status==='Suspended'?'Your account is suspended.':'Waiting for approval.'}</b><p class="mut">You cannot work on the platform until you are approved.</p></div>`;return}
const T=sTabs(u),keys=T.map(x=>x[0]);if(!window._di){window._di=1;sTab=keys[0]}if(!keys.includes(sTab))sTab=keys[0];
h+=`<div class="nav">${T.map(x=>`<button class="tab${x[0]===sTab?' on':''}" onclick="sTab='${x[0]}';dash()">${esc(x[1])}</button>`).join('')}</div>`;
h+=({ov:tOv,ord:tOrd,cod:tCod,pay:tPay,acc:tAcc,exp:tExp,pl:tPl,staff:tStaff,apr:tApr,app:tApp,prod:tProd,off:tOff,site:tSite,me:tMe}[sTab])(u);$('#staff').innerHTML=h}

</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const app=initializeApp({apiKey:"AIzaSyC9bXRSN86pCOkKKRs8ekcR1vYGKO6e3ZQ",authDomain:"fatah-shop.firebaseapp.com",projectId:"fatah-shop",storageBucket:"fatah-shop.firebasestorage.app",messagingSenderId:"301908675488",appId:"1:301908675488:web:aaecda6438fec6dd4632c5"});

({staff:dash,vo:dOff,vd:dDisc,vp:dProf,vs:dSet,vf:dFav,vh:dHelp,vj:dJob})[v]?.()}
function sub(n,q,list){const f=onSnapshot(q,s=>{let a=s.docs.map(d=>d.data());if(n==='orders'||n==='applications'||n==='ledger'||n==='recovery')a.sort((x,y)=>(y.t||0)-(x.t||0));
last[n]=new Map(s.docs.map(d=>[d.id,J(d.data())]));mem[n]=a;if(n==='products')products=a;if(n==='offers')offers=a;if(n==='coupons')coupons=a;refresh()},x=>console.warn(n,x.code));
(list||subs).push(f)}
['products','offers','coupons','site'].forEach(n=>sub(n,collection(db,n),[]));
window.fbPush=(k,nw)=>{const i=k==='coupons'?'code':'id',L=last[k],seen=new Set();
nw.forEach(x=>{const id=String(x[i]),j=J(x);seen.add(id);if(L.get(id)!==j){L.set(id,j);setDoc(doc(db,k,id),JSON.parse(j)).catch(er)}});
[...L.keys()].forEach(id=>{if(!seen.has(id)){L.delete(id);deleteDoc(doc(db,k,id)).catch(er)}})};

async function doSetup(u){subs.splice(0).forEach(f=>f());

mem.users=[m];set('sess',u.uid);const top=m.role==='ceo'||m.role==='admin';

for(const n in D){const g=await getDocs(query(collection(db,n),limit(1)));if(g.empty){if(n==='products')products=D[n];if(n==='offers')offers=D[n];if(n==='coupons')coupons=D[n];set(n,D[n])}}}
else sub('users',query(collection(db,'users'),where('status','==','Approved')))}
subs.push(onSnapshot(doc(db,'users',u.uid),d=>{if(d.exists()){const n=d.data();if(n.status!==m.status||n.role!==m.role||!!n.canEdit!==!!m.canEdit){cur.uid=null;setup(u)}else if(!top&&n.status!=='Approved'){mem.users=[n];refresh()}}}));
refresh()}
function setup(u){if(cur.uid===u.uid)return cur.p;cur.uid=u.uid;return cur.p=doSetup(u)}
onAuthStateChanged(auth,u=>{if(!u){cur.uid=null;subs.splice(0).forEach(f=>f());mem.users=[];mem.orders=[];mem.applications=[];mem.ledger=[];mem.recovery=[];mem.profiles=[];set('sess','');signInAnonymously(auth).catch(()=>toast('Enable Anonymous sign-in in Firebase Authentication'));return}
if(!regBusy)setup(u)});

b.set(doc(db,'users',c.user.uid),{id:c.user.uid,...d,t:Date.now()});
try{await b.commit()}catch(x){await deleteUser(c.user).catch(()=>{});throw x}await signOut(auth)}finally{regBusy=false}};
