async function shrink(f){try{if(!/^image\//.test(f.type))return f;const bm=await createImageBitmap(f),s=Math.min(1,1000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return b?new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):f}catch(x){return f}}
async function upImg(f){if(!f)return'';if(!sb)throw new Error('Supabase is not connected');f=await shrink(f);const p=Date.now()+'-'+f.name.replace(/[^\w.-]/g,'_'),r=await sb.storage.from('products').upload(p,f,{contentType:f.type||'image/jpeg'});if(r.error)throw r.error;return sb.storage.from('products').getPublicUrl(p).data.publicUrl}

let img=($('#pimgu').value||'').trim();if(img&&!/^https:\/\//.test(img))return e('Photo link must start with https://');
if(f){e('Uploading photo...');try{img=await upImg(f)}catch(x){return e('Photo upload failed: '+(x.message||x)+'. Run the Supabase SQL once, or paste a photo link instead.')}}
products.push({id:'p'+Date.now(),e:$('#pe').value||'🛒',n,p,c,u:$('#pu').value.trim(),d:$('#pdsc').value.trim(),img,shop:$('#psh').value.trim()||'jayed.com',fl:$('#pfl').checked,t:Date.now(),by:u.id});

return`<datalist id="cl">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="sl">${shops.map(c=>`<option value="${esc(c)}">`).join('')}</datalist><h3>Add a product</h3><div class="card cr"><p class="mut">Vendors cannot list products. You list them here, with the vendor's shop name.</p><label>Photo</label><label class="btn g w" style="display:block;margin:4px 0 6px">Choose photo<input id="pf" type="file" accept="image/*" hidden onchange="$('#pfn').textContent=this.files[0]?this.files[0].name:''"></label><small id="pfn"></small><label>Or paste a photo link (optional)</label><input id="pimgu" placeholder="https://..."><label>Emoji (shown when there is no photo)</label><input id="pe" value="🛒" maxlength="4"><label>Name</label><input id="pn"><label>Unit (e.g. 1 kg, 12 pcs)</label><input id="pu"><label>Price (৳)</label><input id="pp" type="number" min="1"><label>Description</label><textarea id="pdsc" rows="3"></textarea><label>Category (pick or type a new one)</label><input id="pc" list="cl"><label>Shop / vendor</label><input id="psh" list="sl" value="jayed.com"><label class="ck"><input type="checkbox" id="pfl">Show in Flash Sales</label><button class="btn w" onclick="addP()">List product</button><div id="er"></div></div><h3>All products (${products.length})</h3>`+products.map(p=>`<div class="card cr"><span>${esc(p.e||'')} <b>${esc(p.n)}</b><br><small>৳${p.p} · ${esc(p.c)} · ${esc(p.shop||'')}${p.img?' · photo ✓':''}${p.fl?' · flash':''}</small></span><div class="row"><button class="btn g sm" onclick="editP('${p.id}')">Edit</button><label class="btn g sm" style="margin:0">Photo<input type="file" accept="image/*" hidden onchange="chgImg('${p.id}',this)"></label><button class="btn g sm" onclick="togFl('${p.id}')">${p.fl?'Unflash':'Flash'}</button><button class="btn g sm" onclick="delP('${p.id}')">Delete</button></div></div>`).join('')}

if(m.role==='admin'&&m.status==='Approved'){try{const ma=await getDoc(doc(db,'meta','admin')),mc=await getDoc(doc(db,'meta','ceo'));
if(ma.exists()&&ma.data().uid===u.uid&&!mc.exists()){const b=writeBatch(db);b.update(doc(db,'users',u.uid),{role:'ceo',canEdit:true});b.set(doc(db,'meta','ceo'),{uid:u.uid});await b.commit();m={...m,role:'ceo',canEdit:true};toast('You are now the CEO')}}catch(x){console.warn('ceo upgrade',x.code||x)}}
mem.users=[m];set('sess',u.uid);const top=m.role==='ceo'||m.role==='admin';
if(m.status==='Approved'){sub('orders',collection(db,'orders'));
if(top){sub('users',collection(db,'users'));
const D={products:SEED.map((p,i)=>({id:'p'+i,e:p[0],n:p[1],p:p[2],c:p[3],shop:'jayed.com'})),offers:[{id:'o0',e:'🍳',n:'Breakfast pack',p:270,items:['p4','p5','p3'],shop:'jayed.com'}],coupons:[{code:'FATAH10',pct:10,by:'jayed.com'}]};
for(const n in D){const g=await getDocs(query(collection(db,n),limit(1)));if(g.empty){if(n==='products')products=D[n];if(n==='offers')offers=D[n];if(n==='coupons')coupons=D[n];set(n,D[n])}}}
else sub('users',query(collection(db,'users'),where('status','==','Approved')))}
subs.push(onSnapshot(doc(db,'users',u.uid),d=>{if(d.exists()){const n=d.data();if(n.status!==m.status||n.role!==m.role||!!n.canEdit!==!!m.canEdit){cur.uid=null;setup(u)}else if(!top&&n.status!=='Approved'){mem.users=[n];refresh()}}}));
refresh()}
function setup(u){if(cur.uid===u.uid)return cur.p;cur.uid=u.uid;return cur.p=doSetup(u)}
onAuthStateChanged(auth,u=>{if(!u){cur.uid=null;subs.splice(0).forEach(f=>f());mem.users=[];mem.orders=[];set('sess','');signInAnonymously(auth).catch(()=>toast('Enable Anonymous sign-in in Firebase Authentication'));return}
if(!regBusy)setup(u)});
window.fbLogin=async(em,pw)=>{const c=await signInWithEmailAndPassword(auth,em,pw);await setup(c.user)};
window.fbOut=()=>signOut(auth);
window.fbReg=async(em,pw,d)=>{regBusy=true;try{const c=await createUserWithEmailAndPassword(auth,em,pw),b=writeBatch(db);
b.set(doc(db,'users',c.user.uid),{id:c.user.uid,...d,t:Date.now()});
try{await b.commit()}catch(x){await deleteUser(c.user).catch(()=>{});throw x}await signOut(auth)}finally{regBusy=false}};
</script>
